<button type="button"
        data-inbox-load-older
        hx-get="/admin/inbox/{{ conversation_id }}/messages/older?before={{ oldest_message_id }}"
        hx-trigger="click, intersect once"
        hx-target="this"
        hx-swap="outerHTML"
        class="mx-auto min-h-10 rounded-lg px-3 text-xs font-semibold text-amber-800 hover:bg-amber-50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 dark:text-amber-200 dark:hover:bg-amber-950/30">
    Load earlier messages
</button>
