<section class="rounded-2xl border border-slate-200/80 bg-white p-5 shadow-sm dark:border-slate-700/80 dark:bg-slate-800/90" aria-labelledby="quick-actions-title">
    <div><p class="text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Shortcuts</p><h2 id="quick-actions-title" class="mt-1 text-base font-semibold text-slate-950 dark:text-white">Quick actions</h2></div>
    <div class="mt-4 grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
        {% if show_subscribers %}<a href="/admin/customers/new" class="flex min-h-16 items-center gap-3 rounded-xl border border-slate-200 px-4 py-3 text-sm font-semibold text-slate-800 transition hover:border-amber-300 hover:bg-amber-50 dark:border-slate-700 dark:text-slate-100 dark:hover:border-amber-500/50 dark:hover:bg-amber-950/30"><span class="flex h-9 w-9 items-center justify-center rounded-lg bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300">+</span>Add customer</a>{% endif %}
        {% if show_support %}<a href="/admin/support/tickets/new" class="flex min-h-16 items-center gap-3 rounded-xl border border-slate-200 px-4 py-3 text-sm font-semibold text-slate-800 transition hover:border-blue-300 hover:bg-blue-50 dark:border-slate-700 dark:text-slate-100 dark:hover:border-blue-500/50 dark:hover:bg-blue-950/30"><span class="flex h-9 w-9 items-center justify-center rounded-lg bg-blue-100 text-blue-700 dark:bg-blue-950 dark:text-blue-300" aria-hidden="true">⌁</span>New ticket</a>{% endif %}
        {% if show_financials %}<a href="/admin/billing/payments/new" class="flex min-h-16 items-center gap-3 rounded-xl border border-slate-200 px-4 py-3 text-sm font-semibold text-slate-800 transition hover:border-emerald-300 hover:bg-emerald-50 dark:border-slate-700 dark:text-slate-100 dark:hover:border-emerald-500/50 dark:hover:bg-emerald-950/30"><span class="flex h-9 w-9 items-center justify-center rounded-lg bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300" aria-hidden="true">₦</span>Record payment</a>{% endif %}
        {% if show_network %}<a href="/admin/network/monitoring" class="flex min-h-16 items-center gap-3 rounded-xl border border-slate-200 px-4 py-3 text-sm font-semibold text-slate-800 transition hover:border-violet-300 hover:bg-violet-50 dark:border-slate-700 dark:text-slate-100 dark:hover:border-violet-500/50 dark:hover:bg-violet-950/30"><span class="flex h-9 w-9 items-center justify-center rounded-lg bg-violet-100 text-violet-700 dark:bg-violet-950 dark:text-violet-300" aria-hidden="true">⌁</span>Network monitor</a>{% endif %}
    </div>
</section>
