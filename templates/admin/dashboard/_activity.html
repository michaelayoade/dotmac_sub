<section class="h-full overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-sm dark:border-slate-700/80 dark:bg-slate-800/90" aria-labelledby="important-activity-title">
    <div class="flex items-center justify-between gap-4 border-b border-slate-100 px-5 py-4 dark:border-slate-700/70"><div><p class="text-[10px] font-semibold uppercase tracking-[0.16em] text-slate-500 dark:text-slate-400">Audit stream</p><h2 id="important-activity-title" class="mt-1 text-base font-semibold text-slate-950 dark:text-white">Important activity</h2></div><span class="text-xs text-slate-400 dark:text-slate-500">Updated automatically</span></div>
    {% if recent_activities %}
    <div class="grid divide-y divide-slate-100 dark:divide-slate-700/60 md:grid-cols-2 md:divide-x md:divide-y-0">
        {% for activity in recent_activities[:6] %}<article class="flex min-h-20 items-start gap-3 px-5 py-4 {% if loop.index > 2 %}border-t border-slate-100 dark:border-slate-700/60{% endif %}"><span class="mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-slate-100 text-slate-500 dark:bg-slate-700 dark:text-slate-300" aria-hidden="true"><svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></span><div class="min-w-0 flex-1"><p class="text-sm font-medium text-slate-900 dark:text-white">{{ activity.message }}</p><p class="mt-1 line-clamp-2 text-xs leading-5 text-slate-500 dark:text-slate-400">{{ activity.detail }}</p></div><time class="shrink-0 text-xs text-slate-400 dark:text-slate-500">{{ activity.time }}</time></article>{% endfor %}
    </div>
    {% else %}<div class="px-6 py-12 text-center"><svg class="mx-auto h-9 w-9 text-slate-300 dark:text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><p class="mt-3 text-sm text-slate-500 dark:text-slate-400">No important activity to show.</p></div>{% endif %}
</section>
