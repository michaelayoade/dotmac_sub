<form method="get" class="flex flex-wrap items-end gap-3 rounded-xl border border-slate-200 bg-white p-4 dark:border-slate-700 dark:bg-slate-800">
    {% if audit %}<input type="hidden" name="audit" value="1">{% endif %}
    <label class="min-w-48 flex-1 text-xs font-medium text-slate-600 dark:text-slate-300">Search source identities
        <input type="search" name="q" value="{{ inventory.query }}" placeholder="Name, ID, source, or type" class="mt-1 w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 dark:border-slate-600 dark:bg-slate-900 dark:text-white">
    </label>
    <label class="text-xs font-medium text-slate-600 dark:text-slate-300">Rows per page
        <select name="per_page" class="mt-1 block rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm dark:border-slate-600 dark:bg-slate-900 dark:text-white">
            {% for size in (25, 50, 100) %}<option value="{{ size }}" {% if inventory.per_page == size %}selected{% endif %}>{{ size }}</option>{% endfor %}
        </select>
    </label>
    <button type="submit" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-medium text-white hover:bg-indigo-700">Search</button>
    {% if inventory.query %}<a href="{{ request.url.path }}{% if audit %}?audit=1{% endif %}" class="px-2 py-2 text-sm text-slate-500 hover:text-indigo-600">Clear</a>{% endif %}
</form>
