# generation and loop progression over the same-UID Unix socket.
ping_command = ["python", "-m", "app.syslog.health", "--timeout-seconds", "2"]

[[roles]]
code = "team-inbox-smtp"
command = ["python", "-m", "app.team_inbox_smtp", "serve"]
# docker-compose.yml gates this service behind the `smtp-inbound` profile, and
# production activates it and runs one container. Declaring zero replicas hid it
# from drift comparison (zero-replica roles are skipped), which let it stay on an
# old image across releases. This is the PRODUCTION topology (the opt-in intake
# is started with `make prod-smtp-inbound-up`); nothing in this repo shows a
# staging host running it, so do not read replicas = 1 as a staging claim.
replicas = 1
stop_grace_seconds = 30
materials = ["DATABASE_URL", "OPENBAO_ADDR", "OPENBAO_TOKEN"]

[roles.resources]
cpus = "0.5"
memory = "512m"
pids = 256

[[roles.ports]]
container = 2525
host = 2525
bind = "127.0.0.1"

[migration]
command = ["alembic", "upgrade", "heads"]
heads_command = ["alembic", "current"]
# alembic/env.py consumes this explicit owner material through
# settings.alembic_database_url for online and offline migration setup.
# Foundation requires this material; generic developer commands retain the
# absent-owner runtime URL fallback. A supplied blank owner URL refuses.
owner_material = "MIGRATION_DATABASE_URL"
# Effective composed heads computed with Alembic ScriptDirectory over the
# local lineage plus the nine pinned module migration trees (2026-10-16);
# tests/architecture/test_deployment_descriptor.py re-derives this set in CI.
expected_heads = [
    "698_credential_deactivation_reason",
    "bi_0011_settlement_earmarks",
    "cl_0001_collections",
    "ib_0001_conversations",
    "nu_0001_numbering",
    "pm_0006_cash_qualification",
    "so_0001_service_delivery_orders",
    "su_0003_billing_treatments",
    "ts_0002_notify_identity",
    "tx_0003_result_fingerprint",
]
# Safe direction: Sub's deploy drains and recreates around DDL and several
# migrations change writer/authority boundaries, so no warm old-image path
# is claimed.
compatibility = "maintenance_required"
# scripts/deploy.sh MIGRATION_MAX_ATTEMPTS default.
lock_retries = 4

[ingress]
host = "selfcare.dotmac.io"

[[ingress.routes]]
path = "/"
role = "app"
port = 8001
websocket = false
sse = false

[ingress.static]
static = "image"
uploads = "volume"
uploads_volume = "uploads"
uploads_path = "/app/uploads"

[backup]
[[backup.datasets]]
code = "primary"
kind = "postgres"
material = "BACKUP_DATABASE_URL"
# scripts/db_backup.sh retains a COUNT (default 5), not days; 5 assumes the
# uncommitted host cadence is daily and needs operator correction if not.
retention_days = 5
checksum = "sha256"
# Today's scripts perform no encryption and no restore rehearsal has ever
# been recorded (DB-BACKUP debt); verify below is the foundation requirement,
# not a claim about current scripts.
encryption = "none"
restore_proof_max_age_days = 30
verify = ["schema", "row_counts", "migration_heads"]

[telemetry]
# Foundation collector is NOT adopted: promtail/vmagent remain separate
# Compose services recorded as excluded infrastructure in the conformance
# inventory, so foundation-scraped metrics are not claimed here.
logs = true
metrics = false
traces = false
app_direct_shipping = false
deployment_annotations = true

[egress]
hosts = ["75.119.128.247"]

