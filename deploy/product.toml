[roles.scheduler]
# 2x the DbScheduler DB-refresh default (scheduler.beat_refresh_seconds spec
# default 300s, app/celery_scheduler.py). Recorded gap: the tick command
# reads the celerybeat-schedule file mtime, the only tick-adjacent signal the
# container exposes today; DbScheduler entry last_run_at lives in memory and
# no probe reads it yet. See deploy/README.md.
last_tick_max_age_seconds = 600
tick_command = ["python", "-c", "import os; print(int(os.path.getmtime('celerybeat-schedule')))"]

