# ============================================================================
# SERVING SPEC (not applied by this repository)
# ============================================================================
# Nginx vhost for links.dotmac.io -- the field app's VERIFIED REDIRECT BOUNDARY.
#
# THIS REPOSITORY DOES NOT OWN THIS ORIGIN. dotmac_sub owns selfcare.dotmac.io
# (see ../../nginx/selfcare.dotmac.io.conf and ../nginx/selfcare.dotmac.io);
# links.dotmac.io is fleet-owned and deliberately NOT tied to Sub's deployment
# hostname or to any tenant, because the association documents pin ONE
# application identity and must outlive any single deployment. This file and the
# site/ tree beside it are the authoritative CONTENT and the specification for
# how it must be served; whoever owns the links.dotmac.io host applies them.
#
# Everything environment-specific is a knob with a documented default. Set them
# in the deployment's own include, or edit the three `set` lines below:
#   $links_root   document root                default /srv/links.dotmac.io
#   server_name   the origin's host            default links.dotmac.io
#   ssl_*         certificate paths            default Let's Encrypt live dir
#
# NON-NEGOTIABLE properties (each has a line in
# ../../field_mobile/docs/APP_LINKS_VERIFICATION.md that verifies it):
#   1. HTTPS with a valid, publicly-trusted certificate. Android's App Links
#      verifier and iOS's CDN both refuse a self-signed or expired chain, and
#      they fail SILENTLY -- the link simply opens the browser forever after.
#   2. NO REDIRECTS on either association document. Not http->https, not
#      apex<->www, not a trailing-slash normalisation. Both verifiers follow
#      zero redirects and treat one as "document absent".
#   3. Content-Type: application/json on BOTH documents. The Apple file has no
#      extension, so nginx's mime.types cannot infer it -- `default_type` here
#      is what makes it correct rather than octet-stream.
#   4. No authentication, no geo-fencing, no bot filter, no rate limit in front
#      of /.well-known/. Apple fetches through its own CDN from addresses you
#      cannot predict; Android fetches from the device.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name links.dotmac.io;

    # ACME only. Everything else is redirected -- which is allowed HERE, on
    # port 80, because neither verifier is ever pointed at http://.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name links.dotmac.io;

    # Knob: the document root holding the `site/` tree from this directory.
    set $links_root /srv/links.dotmac.io;

    ssl_certificate     /etc/letsencrypt/live/links.dotmac.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/links.dotmac.io/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    access_log /var/log/nginx/links.dotmac.io.access.log;
    error_log  /var/log/nginx/links.dotmac.io.error.log;

    # This origin serves four static files and nothing else. No upstream, no
    # proxy_pass, no application: an origin whose whole job is to be a
    # cryptographically pinned identity has no business running code.
    server_tokens off;

    # --- Android App Links ---------------------------------------------------
    # `location =` is an EXACT match, so nginx cannot normalise, rewrite or
    # redirect the request. `alias` (not `root`) so the on-disk layout stays
    # free to move.
    location = /.well-known/assetlinks.json {
        alias $links_root/.well-known/assetlinks.json;
        default_type application/json;
        add_header Content-Type application/json always;
        # Short, so a certificate rotation propagates in minutes rather than
        # after a cache lifetime nobody can flush from the device side.
        add_header Cache-Control "public, max-age=300" always;
        access_log /var/log/nginx/links.dotmac.io.association.log;
    }

    # --- iOS Universal Links -------------------------------------------------
    # No file extension by Apple's requirement, hence the explicit default_type.
    location = /.well-known/apple-app-site-association {
        alias $links_root/.well-known/apple-app-site-association;
        default_type application/json;
        add_header Content-Type application/json always;
        add_header Cache-Control "public, max-age=300" always;
        access_log /var/log/nginx/links.dotmac.io.association.log;
    }

    # --- The callback path itself -------------------------------------------
    # On a device with a verified install this is never fetched: the OS routes
    # it to the app. It exists so the URL is real for anyone else -- a desktop
    # browser, a phone without the app, a build whose association has not
    # verified. Static HTML with no script: it must never see, forward or
    # bounce an authorization code.
    location = /oidc/field/callback {
        alias $links_root/oidc/field/callback.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    # Nothing else exists here. A 404 rather than a redirect, so a probe cannot
    # be talked into looking like a working path.
    location / {
        return 404;
    }
}
