name: Version Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: version-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag app version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Determine release commit for the app version
        id: version
        env:
          EVENT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! current_commit="$(git rev-parse --verify "$EVENT_COMMIT^{commit}")"; then
            echo "::error::The exact event commit is unavailable."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$current_commit" ]; then
            echo "::error::The checkout does not match the exact event commit."
            exit 1
          fi
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::Full history is required to find the last VERSION change."
            exit 1
          fi
          if ! current_version="$(git show "$current_commit:VERSION")"; then
            echo "::error::The event commit has no readable VERSION."
            exit 1
          fi
          VERSION="$(printf '%s' "$current_version" | tr -d '[:space:]')"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must be semantic version X.Y.Z, got '$VERSION'"
            exit 1
          fi
          # A cancelled or coalesced run must not lose a release, so the
          # release commit is the last first-parent commit that changed
          # VERSION, not necessarily the pushed commit.
          release_commit="$(git log -1 --first-parent --format=%H "$current_commit" -- VERSION)"
          if ! printf '%s' "$release_commit" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::No first-parent commit that changed VERSION was found."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_commit=$release_commit" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ steps.version.outputs.release_commit }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            existing_commit="$(git rev-parse "$TAG^{commit}")"
            if [ "$existing_commit" = "$RELEASE_COMMIT" ]; then
              echo "Tag $TAG already exists and points at the release commit ($RELEASE_COMMIT); nothing to do."
              exit 0
            fi
            echo "::error::Tag $TAG already exists but its peeled commit is $existing_commit, not the release commit $RELEASE_COMMIT. Refusing to silently accept a version tag that names the wrong release."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$RELEASE_COMMIT"
          git push origin "$TAG"
