name: Version Tag

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: version-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag app version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Determine app version transition
        id: version
        env:
          EVENT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! current_commit="$(git rev-parse --verify "$EVENT_COMMIT^{commit}")"; then
            echo "::error::The exact event commit is unavailable."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "$current_commit" ]; then
            echo "::error::The checkout does not match the exact event commit."
            exit 1
          fi
          if ! parent_commit="$(git rev-parse --verify "$current_commit^1^{commit}")"; then
            echo "::error::The exact first-parent commit is unavailable."
            exit 1
          fi
          if ! current_version="$(git show "$current_commit:VERSION")"; then
            echo "::error::The event commit has no readable VERSION."
            exit 1
          fi
          if ! parent_version="$(git show "$parent_commit:VERSION")"; then
            echo "::error::The first-parent commit has no readable VERSION."
            exit 1
          fi
          VERSION="$(printf '%s' "$current_version" | tr -d '[:space:]')"
          parent_version="$(printf '%s' "$parent_version" | tr -d '[:space:]')"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must be semantic version X.Y.Z, got '$VERSION'"
            exit 1
          fi
          if ! printf '%s' "$parent_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::First-parent VERSION must be semantic version X.Y.Z."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" = "$parent_version" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "No version transition; no tag will be created."
            exit 0
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        if: steps.version.outputs.eligible == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            existing_commit="$(git rev-parse "$TAG^{commit}")"
            current_commit="$(git rev-parse HEAD)"
            if [ "$existing_commit" = "$current_commit" ]; then
              echo "Tag $TAG already exists and points at the current commit ($current_commit); nothing to do."
              exit 0
            fi
            echo "::error::Tag $TAG already exists but its peeled commit is $existing_commit, not the current commit $current_commit. Refusing to silently accept a version tag that names the wrong release."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
