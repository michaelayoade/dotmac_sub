name: Recover staging handoff for 8.55.0

# One-shot operational adapter, confined to this unmerged branch. All image
# verification and deployment remain owned by the existing main workflows.
on:
  push:
    branches: [ops/start-release-3186-20260918]
    paths: [.github/workflows/staging-handoff-8550.yml]

permissions:
  contents: read
  actions: write

concurrency:
  group: staging-handoff-e9a3b1d4da356ee1ed1f901520ff6a9e27bf5163
  cancel-in-progress: false

jobs:
  resume:
    name: Verify enabled staging and resume the existing release
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check live gates and recover the missing completion handoff
        uses: actions/github-script@v7
        env:
          STAGING_AUTO_ENABLED: ${{ vars.STAGING_AUTO_DEPLOY_ENABLED }}
        with:
          retries: 0
          script: |
            const fs = require('fs');
            const path = require('path');
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const candidate = 'e9a3b1d4da356ee1ed1f901520ff6a9e27bf5163';
            const originalRunId = 35388324690;
            const out = path.join(process.env.RUNNER_TEMP, 'staging-handoff-evidence');
            fs.mkdirSync(out, {recursive: true});
            const report = {candidate_sha: candidate, original_build_run_id: originalRunId,
              staging_variable: process.env.STAGING_AUTO_ENABLED,
              production_authorized: false, production_dispatched: false,
              started_at: new Date().toISOString()};
            function save() {
              fs.writeFileSync(path.join(out, 'handoff.json'), JSON.stringify(report, null, 2) + '\n');
            }
            function brief(run) {
              return {id: run.id, name: run.name, head_sha: run.head_sha,
                status: run.status, conclusion: run.conclusion, url: run.html_url};
            }
            save();
            if (repo.owner !== 'michaelayoade' || repo.repo !== 'dotmac_sub') {
              throw new Error('Unexpected repository.');
            }
            if (process.env.STAGING_AUTO_ENABLED !== 'true') {
              throw new Error('Repository STAGING_AUTO_DEPLOY_ENABLED is not exactly true. No setting or deployment was changed.');
            }
            async function requireMain() {
              const current = (await github.rest.repos.getBranch({...repo, branch: 'main'})).data.commit.sha;
              if (current !== candidate) throw new Error(`Main moved to ${current}; refusing the selected candidate.`);
            }
            await requireMain();
            const versionFile = (await github.rest.repos.getContent({...repo, path: 'VERSION', ref: candidate})).data;
            if (versionFile.type !== 'file' || Buffer.from(versionFile.content, 'base64').toString('utf8').trim() !== '8.55.0') {
              throw new Error('Candidate version is not 8.55.0.');
            }
            const original = (await github.rest.actions.getWorkflowRun({...repo, run_id: originalRunId})).data;
            if (original.head_sha !== candidate || original.head_branch !== 'main' ||
                original.event !== 'workflow_dispatch' || original.path !== '.github/workflows/release-candidate.yml' ||
                original.status !== 'completed' || original.conclusion !== 'success') {
              throw new Error('Original candidate is not a successful exact-revision build.');
            }
            report.original_candidate = brief(original);
            const pushRuns = (await github.rest.actions.listWorkflowRunsForRepo({
              ...repo, head_sha: candidate, event: 'push', per_page: 100,
            })).data.workflow_runs;
            report.source_checks = [];
            for (const name of ['CI', 'Mobile CI']) {
              const run = pushRuns.filter(r => r.name === name && r.head_branch === 'main')
                .sort((a, b) => b.id - a.id)[0];
              if (!run || run.status !== 'completed' || run.conclusion !== 'success') {
                throw new Error(`Exact-main ${name} is not successful.`);
              }
              report.source_checks.push(brief(run));
            }
            let workflow = (await github.rest.actions.getWorkflow({...repo, workflow_id: 'staging-deploy.yml'})).data;
            report.workflow_state_before = workflow.state;
            save();
            if (['disabled_manually', 'disabled_inactivity'].includes(workflow.state)) {
              await github.rest.actions.enableWorkflow({...repo, workflow_id: 'staging-deploy.yml'});
              workflow = (await github.rest.actions.getWorkflow({...repo, workflow_id: 'staging-deploy.yml'})).data;
              report.workflow_enabled_by_adapter = true;
            }
            report.workflow_state = workflow.state;
            save();
            if (workflow.state !== 'active') throw new Error(`Staging workflow is ${workflow.state}; no dispatch.`);
            core.info(`LIVE_STAGING_GATE variable=${report.staging_variable} workflow=${workflow.state}`);
            async function stagingRuns() {
              return (await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: 'staging-deploy.yml', branch: 'main', head_sha: candidate, per_page: 100,
              })).data.workflow_runs.filter(r => r.head_sha === candidate).sort((a, b) => b.id - a.id);
            }
            async function recordStaging(run) {
              report.staging = brief(run);
              save();
              core.info(`STAGING_RUN ${run.id} ${run.status}/${run.conclusion || 'pending'} ${run.html_url}`);
              await core.summary.addHeading('8.55.0 staging handoff')
                .addRaw(`Candidate: ${candidate}\n\nRepository staging variable: true. Workflow: active.\n\n`)
                .addLink('Staging deployment', run.html_url).addEOL()
                .addRaw('\nNo production authorization or production deployment was performed.\n').write();
              if (run.status === 'completed' && run.conclusion !== 'success') {
                throw new Error('Staging run exists but did not succeed; inspect it without creating another candidate.');
              }
            }
            const existingStages = await stagingRuns();
            if (existingStages.length) {
              await recordStaging(existingStages[0]);
              return;
            }
            const priorCandidates = (await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: 'release-candidate.yml', branch: 'main', head_sha: candidate,
              event: 'workflow_dispatch', per_page: 100,
            })).data.workflow_runs.filter(r => r.head_sha === candidate && r.id > originalRunId)
              .sort((a, b) => b.id - a.id);
            let recoveryRun = priorCandidates[0];
            if (!recoveryRun) {
              const releaseNames = new Set(['Build release candidate once', 'Deploy main to staging',
                'Promote staged digest for production', 'Deploy authorized digest to production']);
              for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
                const active = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
                  {...repo, status, per_page: 100});
                const conflict = active.find(r => releaseNames.has(r.name));
                if (conflict) throw new Error(`Release operation already active: ${conflict.html_url}.`);
              }
              await requireMain();
              if ((await stagingRuns()).length) throw new Error('Staging appeared before dispatch; inspect existing run.');
              report.dispatch_started_at = new Date().toISOString();
              save();
              await github.rest.actions.createWorkflowDispatch({
                ...repo, workflow_id: 'release-candidate.yml', ref: 'main', inputs: {candidate_sha: candidate},
              });
              report.dispatch_accepted = true;
              save();
              core.info('DISPATCH_ACCEPTED: existing main workflow will verify and reuse the already-published image.');
            } else {
              report.reused_dispatch = brief(recoveryRun);
              save();
            }
            const deadline = Date.now() + 8 * 60 * 1000;
            let previous = '';
            while (Date.now() < deadline) {
              await requireMain();
              const stages = await stagingRuns();
              if (stages.length) {
                await recordStaging(stages[0]);
                return;
              }
              const candidates = (await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: 'release-candidate.yml', branch: 'main', head_sha: candidate,
                event: 'workflow_dispatch', per_page: 100,
              })).data.workflow_runs.filter(r => r.head_sha === candidate && r.id > originalRunId)
                .sort((a, b) => b.id - a.id);
              recoveryRun = candidates[0];
              if (recoveryRun) {
                report.recovery_candidate = brief(recoveryRun);
                save();
                const state = `${recoveryRun.id}: ${recoveryRun.status}/${recoveryRun.conclusion || 'pending'}`;
                if (state !== previous) { core.info(state); previous = state; }
                if (recoveryRun.status === 'completed' && recoveryRun.conclusion !== 'success') {
                  throw new Error('Recovery candidate did not succeed. No deployment or evidence bypass attempted.');
                }
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('No staging run observed after the guarded dispatch. Evidence retained; do not repeat blindly.');
      - name: Retain non-secret live-gate and handoff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-handoff-8550
          path: ${{ runner.temp }}/staging-handoff-evidence/handoff.json
          if-no-files-found: warn
          retention-days: 7
