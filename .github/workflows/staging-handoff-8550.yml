name: Verify staging handoff for 8.55.0

# Read-only diagnostic on an unmerged operations branch. No dispatch, build,
# deployment, variable mutation, release authorization or main change.
on:
  push:
    branches: [ops/start-release-3186-20260918]
    paths: [.github/workflows/staging-handoff-8550.yml]

permissions:
  contents: read
  actions: read

# Cancels only the earlier diagnostic observer, never a release workflow.
concurrency:
  group: staging-handoff-e9a3b1d4da356ee1ed1f901520ff6a9e27bf5163
  cancel-in-progress: true

jobs:
  diagnose:
    name: Record live staging settings and exact release status
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read the existing staging gate without changing it
        uses: actions/github-script@v7
        env:
          STAGING_AUTO_ENABLED: ${{ vars.STAGING_AUTO_DEPLOY_ENABLED }}
        with:
          retries: 0
          script: |
            const fs = require('fs');
            const path = require('path');
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            if (repo.owner !== 'michaelayoade' || repo.repo !== 'dotmac_sub') {
              throw new Error('Unexpected repository.');
            }
            const candidate = 'e9a3b1d4da356ee1ed1f901520ff6a9e27bf5163';
            function brief(run) {
              return {id: run.id, name: run.name, event: run.event, head_sha: run.head_sha,
                status: run.status, conclusion: run.conclusion, actor: run.actor.login,
                url: run.html_url};
            }
            const main = (await github.rest.repos.getBranch({...repo, branch: 'main'})).data;
            const workflow = (await github.rest.actions.getWorkflow({...repo, workflow_id: 'staging-deploy.yml'})).data;
            const original = (await github.rest.actions.getWorkflowRun({...repo, run_id: 35388324690})).data;
            const recovery = (await github.rest.actions.getWorkflowRun({...repo, run_id: 35392859692})).data;
            const stages = (await github.rest.actions.listWorkflowRuns({
              ...repo, workflow_id: 'staging-deploy.yml', branch: 'main', head_sha: candidate, per_page: 100,
            })).data.workflow_runs.filter(run => run.head_sha === candidate);
            const report = {
              observed_at: new Date().toISOString(), candidate_sha: candidate,
              main_sha: main.commit.sha,
              staging_auto_deploy_enabled: process.env.STAGING_AUTO_ENABLED,
              staging_workflow_state: workflow.state,
              original_candidate: brief(original), recovery_candidate: brief(recovery),
              staging_runs: stages.map(brief),
              handoff_status: stages.length ? 'staging_run_present' : 'staging_run_not_created',
              new_dispatch_performed: false, production_authorization_performed: false,
              production_deployment_performed: false,
            };
            const out = path.join(process.env.RUNNER_TEMP, 'staging-handoff-evidence');
            fs.mkdirSync(out, {recursive: true});
            fs.writeFileSync(path.join(out, 'handoff.json'), JSON.stringify(report, null, 2) + '\n');
            core.info(JSON.stringify(report, null, 2));
            await core.summary.addHeading('Read-only staging handoff verification')
              .addCodeBlock(JSON.stringify(report, null, 2), 'json').write();
      - name: Retain non-secret staging diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-handoff-8550-diagnostic
          path: ${{ runner.temp }}/staging-handoff-evidence/handoff.json
          if-no-files-found: error
          retention-days: 7
