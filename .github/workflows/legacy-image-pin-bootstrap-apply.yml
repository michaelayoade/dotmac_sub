name: Apply authorized legacy image-pin bootstrap

# The production lane. It is separate from the plan lane, requires two distinct
# first-attempt byte-identical plans, and is structurally single-use: a
# terminal receipt on the host permanently refuses a second run.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected-main SHA that produced both plans
        required: true
        type: string
      plan_digest:
        description: Reviewed sha256 digest of the byte-identical plans
        required: true
        type: string
      first_plan_run_id:
        description: First terminal-success first-attempt plan run
        required: true
        type: string
      second_plan_run_id:
        description: Second distinct terminal-success first-attempt plan run
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: dotmac-sub-production-legacy-image-pin
  cancel-in-progress: false

jobs:
  admit:
    name: Admit exact terminal plan evidence
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Refuse disabled, rerun, mutable or duplicate dispatch
        env:
          ENABLED: ${{ vars.LEGACY_IMAGE_PIN_BOOTSTRAP_ENABLED }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          PLAN_DIGEST: ${{ inputs.plan_digest }}
          FIRST_RUN: ${{ inputs.first_plan_run_id }}
          SECOND_RUN: ${{ inputs.second_plan_run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$ENABLED" = "true" || { echo "bootstrap is disabled" >&2; exit 1; }
          test "$RUN_ATTEMPT" = "1" || { echo "reruns are not admissible" >&2; exit 1; }
          test "$EVENT_REF" = "refs/heads/main" || { echo "not protected main" >&2; exit 1; }
          test "$SOURCE_SHA" = "$EVENT_SHA" || { echo "source is not the dispatched head" >&2; exit 1; }
          test "$FIRST_RUN" != "$SECOND_RUN" || { echo "two distinct plan runs are required" >&2; exit 1; }
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "source is not a full SHA" >&2; exit 1; }
          printf '%s' "$PLAN_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$' || { echo "plan digest is malformed" >&2; exit 1; }
          printf '%s' "$FIRST_RUN" | grep -Eq '^[1-9][0-9]*$' || { echo "first run id is malformed" >&2; exit 1; }
          printf '%s' "$SECOND_RUN" | grep -Eq '^[1-9][0-9]*$' || { echo "second run id is malformed" >&2; exit 1; }

      - name: Observe current protected main and both terminal runs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          FIRST_RUN: ${{ inputs.first_plan_run_id }}
          SECOND_RUN: ${{ inputs.second_plan_run_id }}
        with:
          script: |
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner, repo: context.repo.repo, branch: "main",
            });
            if (!branch.data.protected) { core.setFailed("main is not protected"); return; }
            if (branch.data.commit.sha !== process.env.SOURCE_SHA) {
              core.setFailed("protected main moved away from the admitted source");
              return;
            }
            for (const id of [process.env.FIRST_RUN, process.env.SECOND_RUN]) {
              const { data: run } = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner, repo: context.repo.repo, run_id: Number(id),
              });
              if (run.path !== ".github/workflows/legacy-image-pin-bootstrap-plan.yml") {
                core.setFailed(`run ${id} is not a bootstrap plan run`); return;
              }
              if (run.name !== "Plan legacy image-pin bootstrap") {
                core.setFailed(`run ${id} has an unexpected workflow name`); return;
              }
              if (run.head_repository.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
                core.setFailed(`run ${id} came from a fork`); return;
              }
              if (run.head_branch !== "main") { core.setFailed(`run ${id} is not from main`); return; }
              if (run.head_sha !== process.env.SOURCE_SHA) {
                core.setFailed(`run ${id} planned another source`); return;
              }
              if (run.event !== "workflow_dispatch") { core.setFailed(`run ${id} was not dispatched`); return; }
              if (run.run_attempt !== 1) { core.setFailed(`run ${id} is a rerun`); return; }
              if (run.status !== "completed") { core.setFailed(`run ${id} is not terminal`); return; }
              if (run.conclusion !== "success") { core.setFailed(`run ${id} did not succeed`); return; }
            }

      - name: Download first exact plan artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: legacy-image-pin-plan-v1-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/apply-inputs/plan-1
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.first_plan_run_id }}

      - name: Download second exact plan artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: legacy-image-pin-plan-v1-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/apply-inputs/plan-2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.second_plan_run_id }}

      - name: Upload exact observed plan evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-image-pin-apply-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/apply-inputs/
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Apply the single-use image pin under a persistent deadman
    needs: admit
    runs-on: [self-hosted, linux, x64, dotmac-sub-production]
    environment: production
    timeout-minutes: 20
    steps:
      - name: Re-observe protected main after production authorization
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            if (process.env.RUN_ATTEMPT !== "1") {
              core.setFailed("APPLY workflow reruns are not admissible"); return;
            }
            const { data } = await github.rest.repos.getBranch({
              owner: context.repo.owner, repo: context.repo.repo, branch: "main",
            });
            if (data.commit.sha !== process.env.SOURCE_SHA) {
              core.setFailed("protected main moved away from the admitted source");
            }

      - name: Checkout exact admitted source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download this run's observed apply inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: legacy-image-pin-apply-inputs-${{ github.run_id }}
          path: ${{ runner.temp }}/apply-inputs

      - name: Verify pinned Python and Pydantic toolchain
        env:
          PYTHON_BIN: ${{ vars.PUBLISHED_PORT_RECONCILE_PYTHON_BIN }}
        run: |
          set -euo pipefail
          bash scripts/reconcile_published_ports_v2.sh verify-toolchain

      - name: Build typed admission under the authenticated production gate
        env:
          PYTHON_BIN: ${{ vars.PUBLISHED_PORT_RECONCILE_PYTHON_BIN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          APPLY_RUN_ID: ${{ github.run_id }}
          EXPECTED_PLAN_DIGEST: ${{ inputs.plan_digest }}
          FIREWALL_VERIFIER_IDENTITY: ${{ vars.PUBLISHED_PORT_FIREWALL_VERIFIER_IDENTITY }}
          CLIENT_COLLECTOR_IDENTITY: ${{ vars.PUBLISHED_PORT_CLIENT_COLLECTOR_IDENTITY }}
        run: |
          set -euo pipefail
          test -n "$PYTHON_BIN"
          "$PYTHON_BIN" -m scripts.legacy_image_pin_bootstrap admit \
            --first-dir "$RUNNER_TEMP/apply-inputs/plan-1" \
            --second-dir "$RUNNER_TEMP/apply-inputs/plan-2" \
            --source-sha "$SOURCE_SHA" \
            --apply-run-id "$APPLY_RUN_ID" \
            --admitted-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --expected-plan-digest "$EXPECTED_PLAN_DIGEST" \
            --firewall-verifier-identity "$FIREWALL_VERIFIER_IDENTITY" \
            --client-collector-identity "$CLIENT_COLLECTOR_IDENTITY" \
            --output "$RUNNER_TEMP/admission.json"
          install -m 0600 "$RUNNER_TEMP/apply-inputs/plan-1/plan.json" \
            "$RUNNER_TEMP/admitted-plan.json"

      - name: Apply the admitted single-use image pin
        env:
          PRODUCTION_DEPLOY_DIR: ${{ vars.PRODUCTION_DEPLOY_DIR }}
          PYTHON_BIN: ${{ vars.PUBLISHED_PORT_RECONCILE_PYTHON_BIN }}
          FIREWALL_PROOF_DIR: ${{ vars.PUBLISHED_PORT_FIREWALL_PROOF_DIR }}
          CLIENT_PROOF_DIR: ${{ vars.PUBLISHED_PORT_CLIENT_PROOF_DIR }}
          OUTPUT_DIR: ${{ runner.temp }}/legacy-image-pin-outcome
          SOURCE_SHA: ${{ inputs.source_sha }}
          APPLY_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$OUTPUT_DIR"
          REPO_DIR="$GITHUB_WORKSPACE" DEPLOY_DIR="$PRODUCTION_DEPLOY_DIR" \
            bash scripts/legacy_image_pin_bootstrap.sh apply \
              --plan "$RUNNER_TEMP/admitted-plan.json" \
              --admission "$RUNNER_TEMP/admission.json" \
              --source-sha "$SOURCE_SHA" \
              --apply-run-id "$APPLY_RUN_ID" \
              --output-dir "$OUTPUT_DIR" \
              --firewall-proof-dir "$FIREWALL_PROOF_DIR" \
              --reach-proof-dir "$CLIENT_PROOF_DIR"

      - name: Upload sanitized terminal bootstrap receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-image-pin-outcome-${{ github.run_id }}
          path: ${{ runner.temp }}/legacy-image-pin-outcome/
          if-no-files-found: error
          retention-days: 30
