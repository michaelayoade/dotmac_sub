# TEMPORARY. Delete this workflow once the managed deployment path has produced
# its first successful production prerequisite receipt.
#
# It exists only because the managed repair leg did not, and a hand-dispatched
# job writing production database state is precisely the executor class this
# programme is retiring. It is deliberately NOT authorized for production: the
# production job below refuses. Production schema repair happens as the managed
# repair leg of a real deployment (scripts/deploy.sh) or not at all.
#
# PR #2843's Unix-socket approach is reverted here. It assumed the container's
# socket was reachable at /proc/<pid>/root/var/run/postgresql, but /var/run is a
# symlink to /run inside the alpine image and the host kernel resolves that
# absolute target against the HOST root, so the path can never exist. Measured
# on the production host 2026-08-31. The former staging leg used TCP with a
# dedicated schema-bootstrap role, but its pinned image still verified through
# the runtime URL. Both hand-dispatched targets are now refused.
name: Temporary commercial module prerequisite repair

on:
  workflow_dispatch:
    inputs:
      target:
        description: Exact database target to repair
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: temporary-module-prereq-repair-${{ inputs.target }}
  cancel-in-progress: false

env:
  REPAIR_IMAGE: ghcr.io/michaelayoade/dotmac_sub@sha256:526daf4ed676ae560c4cee574f65a0ef7c4064c72ad8dfa0648cbd22ab6f772e
  REPAIR_REVISION: 43482aeb0a5a42488d435181a08ef4b3ce84d151

jobs:
  staging:
    name: Refuse legacy staging prerequisite repair
    if: inputs.target == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse legacy image and runtime migration URL
        run: |
          echo 'REFUSED: this temporary workflow pins a pre-split image and used the runtime database URL for migration verification.' >&2
          echo 'Use a reviewed managed deployment with an actual app_admin migration connection and separately reviewed schema ownership cutover.' >&2
          exit 1

  production:
    name: Repair production prerequisites
    if: inputs.target == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse — production repair is not authorized through this workflow
        run: |
          cat >&2 <<'REFUSAL'
          REFUSED: production module schema repair is not authorized through the
          temporary repair workflow.

          Production repair runs only as the managed repair leg of a real
          deployment: scripts/deploy.sh probes the contract, and when repair is
          required it uses the dedicated dotmac_schema_bootstrap credential and
          reports already_satisfied / repaired / blocked. That path takes a
          backup first, verifies afterwards, and leaves a deployment receipt.
          None of that is true of a hand-dispatched job.

          See docs/runbooks/PRODUCTION_DEPLOYMENT.md, "Module database
          prerequisites".
          REFUSAL
          exit 1
