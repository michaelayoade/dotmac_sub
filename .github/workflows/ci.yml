name: CI

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  DATABASE_URL: "sqlite:///./test.db"
  SECRET_KEY: "ci-test-secret-key-not-for-production" # pragma: allowlist secret
  REDIS_URL: "redis://localhost:6379/0"

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
      application: ${{ steps.classify.outputs.application }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            echo "application=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base="$BEFORE_SHA"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif [ "$EVENT_NAME" = "merge_group" ]; then
            base="$MERGE_BASE_SHA"
          fi

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi

          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed-paths"
          if [ ! -s "$RUNNER_TEMP/changed-paths" ]; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            echo "application=true" >> "$GITHUB_OUTPUT"
          elif grep -Ev '^(docs/|.*\.md$)' "$RUNNER_TEMP/changed-paths" >/dev/null; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            echo "application=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
            echo "application=false" >> "$GITHUB_OUTPUT"
          fi

  python-environment:
    name: Prepare Python Environment
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Restore Python environment
        id: python-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: python-venv-v2-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('poetry.lock', 'pyproject.toml') }}

      - name: Install dependencies
        if: steps.python-cache.outputs.cache-hit != 'true'
        run: poetry install --no-interaction

      - name: Pack Python environment
        run: tar -czf "$RUNNER_TEMP/python-venv.tar.gz" .venv

      - name: Share Python environment
        uses: actions/upload-artifact@v4
        with:
          name: python-venv
          path: ${{ runner.temp }}/python-venv.tar.gz
          retention-days: 1
          compression-level: 0

  lint:
    name: Lint & Format
    needs: [changes, python-environment]
    if: always() && needs.changes.result == 'success' && (needs.changes.outputs.docs-only == 'true' || needs.python-environment.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.docs-only == 'true'
        run: echo "Lint and format checks are not needed for documentation-only changes."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs-only != 'true'

      - uses: ./.github/actions/setup-ci-python
        if: needs.changes.outputs.docs-only != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Ruff check
        if: needs.changes.outputs.docs-only != 'true'
        run: poetry run ruff check app tests scripts alembic

      - name: Ruff format check
        if: needs.changes.outputs.docs-only != 'true'
        run: poetry run ruff format --check app tests scripts alembic

  type-check:
    name: Type Check
    needs: [changes, python-environment]
    if: always() && needs.changes.result == 'success' && (needs.changes.outputs.docs-only == 'true' || needs.python-environment.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.docs-only == 'true'
        run: echo "Type checking is not needed for documentation-only changes."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs-only != 'true'

      - uses: ./.github/actions/setup-ci-python
        if: needs.changes.outputs.docs-only != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run mypy
        if: needs.changes.outputs.docs-only != 'true'
        run: poetry run mypy app --ignore-missing-imports --no-incremental

  import-boundaries:
    name: Import Boundaries
    needs: [changes, python-environment]
    if: always() && needs.changes.result == 'success' && (needs.changes.outputs.docs-only == 'true' || needs.python-environment.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.docs-only == 'true'
        run: echo "Import-boundary checks are not needed for documentation-only changes."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs-only != 'true'

      - uses: ./.github/actions/setup-ci-python
        if: needs.changes.outputs.docs-only != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run import-linter
        if: needs.changes.outputs.docs-only != 'true'
        run: poetry run lint-imports

  unit-shards:
    name: Unit Tests (shard ${{ matrix.shard }}/4)
    needs: [changes, python-environment]
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run unit-test shard
        env:
          COVERAGE_CORE: sysmon
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
        run: |
          test_paths="$(python scripts/ci/select_test_shard.py --shard "${{ matrix.shard }}" --shards 4)"
          poetry run pytest $test_paths -n auto --durations=25 --cov=app --cov-report= -q

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          retention-days: 1

  architecture:
    name: Architecture Tests
    needs: [changes, python-environment]
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run architecture guards
        run: make test-architecture

  test:
    name: Tests
    needs: [changes, python-environment, unit-shards, architecture]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.docs-only == 'true'
        run: echo "Unit and architecture tests are not needed for documentation-only changes."

      - name: Require all test groups
        if: needs.changes.outputs.docs-only != 'true'
        env:
          PYTHON_ENVIRONMENT_RESULT: ${{ needs.python-environment.result }}
          UNIT_RESULT: ${{ needs.unit-shards.result }}
          ARCHITECTURE_RESULT: ${{ needs.architecture.result }}
        run: |
          test "$PYTHON_ENVIRONMENT_RESULT" = "success"
          test "$UNIT_RESULT" = "success"
          test "$ARCHITECTURE_RESULT" = "success"

  coverage:
    name: Combine Coverage
    needs: [changes, python-environment, unit-shards]
    if: needs.changes.outputs.docs-only != 'true' && needs.unit-shards.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/download-artifact@v4
        with:
          pattern: unit-coverage-*
          merge-multiple: true

      - name: Create combined coverage report
        run: |
          poetry run coverage combine
          poetry run coverage xml

      - name: Upload coverage report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Security Scan
    needs: [changes, python-environment]
    if: always() && needs.changes.result == 'success' && (needs.changes.outputs.docs-only == 'true' || needs.python-environment.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.docs-only == 'true'
        run: echo "Application security scans are not needed for documentation-only changes."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs-only != 'true'

      - uses: ./.github/actions/setup-ci-python
        if: needs.changes.outputs.docs-only != 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Security lint
        if: needs.changes.outputs.docs-only != 'true'
        run: poetry run ruff check app --select S --ignore S101,S105,S110,S112,S507,S603,S607

      - name: Bandit security scan
        if: needs.changes.outputs.docs-only != 'true'
        run: poetry run bandit -r app -c pyproject.toml -q

  pre-commit:
    name: Pre-commit
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: pre-commit/action@v3.0.1

  integration-run:
    name: PostgreSQL Gate
    needs: [changes, python-environment]
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dotmac_sub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/dotmac_sub_test"
      TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/dotmac_sub_test"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-ci-python
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Alembic migrations
        run: poetry run alembic upgrade head

      - name: Run integration tests
        run: make test-integration

  integration-test:
    name: Integration Tests (PostgreSQL)
    needs: [changes, integration-run]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.docs-only == 'true'
        run: echo "PostgreSQL checks are not needed for documentation-only changes."

      - name: Require PostgreSQL gate
        if: needs.changes.outputs.docs-only != 'true'
        env:
          INTEGRATION_RESULT: ${{ needs.integration-run.result }}
        run: test "$INTEGRATION_RESULT" = "success"

  docker-build:
    name: Docker Build & Health Check
    needs: [changes, lint, type-check, import-boundaries, test, security, pre-commit, integration-test]
    if: always() && needs.changes.result == 'success' && (needs.changes.outputs.docs-only == 'true' || (needs.lint.result == 'success' && needs.type-check.result == 'success' && needs.import-boundaries.result == 'success' && needs.test.result == 'success' && needs.security.result == 'success' && needs.pre-commit.result == 'success' && needs.integration-test.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.docs-only == 'true'
        run: echo "Docker build and health checks are not needed for documentation-only changes."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.docs-only != 'true'

      - name: Set up Docker Buildx
        if: needs.changes.outputs.docs-only != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image once
        if: needs.changes.outputs.docs-only != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: dotmac-sub:ci
          cache-from: type=gha,scope=dotmac-sub-application
          cache-to: type=gha,mode=max,scope=dotmac-sub-application

      - name: Create CI network and services
        if: needs.changes.outputs.docs-only != 'true'
        run: |
          docker network create ci-net
          docker run -d --name ci-db --network ci-net \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=dotmac_sub_ci \
            --health-cmd "pg_isready -U postgres" --health-interval 5s \
            --health-retries 10 postgis/postgis:16-3.4
          docker run -d --name ci-redis --network ci-net redis:7
          for i in $(seq 1 30); do
            docker exec ci-db pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Run migrations and application health check
        if: needs.changes.outputs.docs-only != 'true'
        run: |
          common_args="--network ci-net \
            -e DATABASE_URL=postgresql+psycopg://postgres:postgres@ci-db:5432/dotmac_sub_ci \
            -e SECRET_KEY=ci-test-secret-key-not-for-production \
            -e REDIS_URL=redis://ci-redis:6379/0"
          docker run --rm $common_args dotmac-sub:ci alembic upgrade head
          docker run -d --name ci-app $common_args \
            -e CELERY_BROKER_URL=redis://ci-redis:6379/0 dotmac-sub:ci
          for i in $(seq 1 60); do
            status="$(docker inspect --format='{{.State.Status}}' ci-app 2>/dev/null || echo missing)"
            if [ "$status" = "exited" ]; then
              docker logs ci-app
              exit 1
            fi
            health="$(docker exec ci-app python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8001/health').read().decode())" 2>/dev/null || true)"
            echo "$health" | grep -qi 'ok\|healthy' && exit 0
            sleep 3
          done
          docker logs ci-app
          exit 1

      - name: Log in to GitHub Container Registry
        if: needs.changes.outputs.docs-only != 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the health-checked image
        if: needs.changes.outputs.docs-only != 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          image_name="$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::7}"
          release_date="$(date -u +%F)"
          for tag in "sha-$short_sha" latest "$release_date"; do
            docker tag dotmac-sub:ci "$image_name:$tag"
            docker push "$image_name:$tag"
          done

      - name: Cleanup
        if: always() && needs.changes.outputs.docs-only != 'true'
        run: |
          docker rm -f ci-app ci-db ci-redis 2>/dev/null || true
          docker network rm ci-net 2>/dev/null || true
