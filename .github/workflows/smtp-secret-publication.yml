name: Validate and publish reviewed SMTP credential fix
on:
  push:
    branches: [work/smtp-secret-publication-20260916]
permissions:
  contents: write
  actions: read
concurrency:
  group: smtp-secret-publication-20260916
  cancel-in-progress: false
jobs:
  validate-publish:
    if: github.actor == 'ObiechinaJeffery'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: 55a69bdce87772d19ab659a77385c3f65ffc1e20
      EXPECTED_TREE: 76837327ed723f4c8116b03db45f8832754ed19b
      FEATURE_BRANCH: fix/smtp-sender-secret-resolution
      APP_ENV: development
      SERVER_NAME: smtp-secret-ci
      DATABASE_URL: sqlite:///./test.db
      SECRET_KEY: ci-test-secret-key-not-for-production
      REDIS_URL: redis://127.0.0.1:9/0
    steps:
      - uses: actions/checkout@v4
      - name: Verify reviewed patch and isolate exact main
        shell: bash
        run: |
          set -euo pipefail
          cat .github/smtp-review/part-* | base64 --decode | gzip --decompress > "$RUNNER_TEMP/smtp-fix.patch"
          echo "8bc0dc8c1560618ba034bb3988fe2586985292d02dd6288a85e33eaa0e7c0266  $RUNNER_TEMP/smtp-fix.patch" | sha256sum --check
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git checkout --detach "$BASE_SHA"
          test -z "$(git status --porcelain)"
          git apply --index "$RUNNER_TEMP/smtp-fix.patch"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12.13
      - uses: actions/download-artifact@v4
        with:
          name: python-environment
          run-id: 35047151311
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/smtp-python-environment
      - name: Restore repository-pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo '60ebcd0743b10ca3943dae56414f4d32914d9cdaf7e535a59c5a5dbbd5087a3e  pyproject.toml' | sha256sum --check
          if [ -L .venv ]; then rm .venv; fi
          tar -xzf "$RUNNER_TEMP/smtp-python-environment/python-venv.tar.gz"
          .venv/bin/python --version
          .venv/bin/python -m ruff --version
      - name: Validate repository-wide static checks
        shell: bash
        run: |
          set -euo pipefail
          .venv/bin/python -m ruff check app tests scripts alembic
          .venv/bin/python -m ruff format --check app tests scripts alembic
          .venv/bin/python -m mypy app --ignore-missing-imports --no-incremental
          .venv/bin/lint-imports
          .venv/bin/bandit -r app -c pyproject.toml -q
          .venv/bin/python -m compileall -q app tests scripts alembic
      - name: Validate encrypted sender and existing email behavior
        shell: bash
        run: |
          .venv/bin/python -m pytest tests/test_smtp_sender_secret_resolution.py tests/test_secret_settings_at_rest.py tests/test_email_services.py tests/test_web_system_email.py tests/test_settings_kernel_parity.py tests/test_domain_settings_scope.py tests/test_notification_queue_channels.py -q --junitxml="$RUNNER_TEMP/smtp-focused.xml"
      - name: Validate architecture guards
        shell: bash
        run: |
          .venv/bin/python -m pytest tests/architecture -n 4 -q --junitxml="$RUNNER_TEMP/smtp-architecture.xml"
      - name: Publish only the validated feature tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --exit-code
          git diff --cached --check
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          if [ -n "$(git ls-remote --heads origin "$FEATURE_BRANCH")" ]; then
            echo 'Feature branch already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          git switch -c "$FEATURE_BRANCH"
          git -c user.name=ObiechinaJeffery -c user.email=97806905+ObiechinaJeffery@users.noreply.github.com commit -m 'fix(smtp): resolve encrypted named sender credentials before authentication'
          git push origin "HEAD:refs/heads/$FEATURE_BRANCH"
          printf 'Branch: %s\nCommit: %s\nTree: %s\n' "$FEATURE_BRANCH" "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" | tee "$RUNNER_TEMP/smtp-publication.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smtp-secret-validation-evidence
          path: |
            ${{ runner.temp }}/smtp-focused.xml
            ${{ runner.temp }}/smtp-architecture.xml
            ${{ runner.temp }}/smtp-publication.txt
          if-no-files-found: ignore
          retention-days: 7
