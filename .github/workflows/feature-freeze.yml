name: Feature Freeze Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: feature-freeze-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Feature Freeze Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Fetch base branch
        # Full history (no --depth): the three-dot diff in
        # check_feature_freeze.py needs the merge-base of base and HEAD.
        run: git fetch --no-tags origin ${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}

      - name: Load gate and exceptions from the base branch
        # Trusted inputs only: the gate script and the exceptions file come
        # from the base branch, never from the PR head, so a PR cannot
        # weaken the gate or approve its own exception.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/freeze-gate"
          git show "origin/${BASE_REF}:scripts/ci/check_feature_freeze.py" > "$RUNNER_TEMP/freeze-gate/check_feature_freeze.py"
          git show "origin/${BASE_REF}:docs/feature_freeze_exceptions.json" > "$RUNNER_TEMP/freeze-gate/feature_freeze_exceptions.json"

      - name: Validate feature freeze
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 "$RUNNER_TEMP/freeze-gate/check_feature_freeze.py" --base "origin/${BASE_REF}" --head HEAD --exceptions "$RUNNER_TEMP/freeze-gate/feature_freeze_exceptions.json"
