name: Prepare isolated SMTP validation runtime
on:
  push:
    branches: [work/smtp-validation-runtime-20260916]
    paths: [.github/workflows/smtp-validation-runtime.yml]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Package public Python runtime only
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import sys; assert sys.version_info[:3] == (3, 12, 13)'
          tar -czf "$RUNNER_TEMP/python-3.12.13-runtime.tar.gz" -C /opt/hostedtoolcache/Python/3.12.13 x64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smtp-validation-python-3.12.13
          path: ${{ runner.temp }}/python-3.12.13-runtime.tar.gz
          retention-days: 1
          if-no-files-found: error
