name: Deploy authorized digest to production

on:
  workflow_dispatch:
    inputs:
      authorization_run_id:
        description: Successful Promote staged digest for production run ID
        required: true
        type: string
      target_server_name:
        description: Explicit production target (must match the host contract)
        required: true
        type: string
      hotfix_no_migrations:
        description: Request the verified no-migration hotfix backup exception
        required: true
        default: false
        type: boolean
      change_reference:
        description: Required incident or change reference for a hotfix exception
        required: false
        type: string
      reason:
        description: Required reason for a hotfix exception
        required: false
        type: string
      rollback_from_revision:
        description: "Rollback only: exact full SHA currently running in production"
        required: false
        type: string
      rollback_to_revision:
        description: "Rollback only: exact full SHA being deployed (must equal the authorized release revision)"
        required: false
        type: string
      rollback_change_reference:
        description: "Rollback only: incident or change reference"
        required: false
        type: string
      rollback_reason:
        description: "Rollback only: why production is being moved backwards"
        required: false
        type: string
      bootstrap_target_revision:
        description: "First deployment only: exact full SHA being deployed to an empty production host"
        required: false
        type: string
      bootstrap_change_reference:
        description: "First deployment only: approved change reference"
        required: false
        type: string
      bootstrap_reason:
        description: "First deployment only: why the empty production host is being initialized"
        required: false
        type: string
      resume_after_migration:
        description: Resume a failed production run after backup and migrations already completed
        required: true
        default: false
        type: boolean
      failed_deployment_run_id:
        description: Required prior failed production deploy run ID for resume
        required: false
        type: string
      prior_backup_path:
        description: Required on-host backup artifact path from the prior failed run
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: dotmac-sub-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      authorization_main_revision: ${{ steps.evidence.outputs.authorization_main_revision }}
      source_revision: ${{ steps.evidence.outputs.source_revision }}
      release_revision: ${{ steps.evidence.outputs.release_revision }}
      image_digest: ${{ steps.evidence.outputs.image_digest }}
    steps:
      - name: Require explicit enabled production target
        env:
          ENABLED: ${{ vars.PRODUCTION_DEPLOY_ENABLED }}
          TARGET: ${{ inputs.target_server_name }}
        run: |
          set -euo pipefail
          test "$ENABLED" = "true" || {
            echo "Production deployment workflow is disabled." >&2
            exit 1
          }
          test "$TARGET" = "dotmac-sub-prod" || {
            echo "Explicit target must be dotmac-sub-prod." >&2
            exit 1
          }

      - name: Require successful exact authorization run
        id: authorization-run
        uses: actions/github-script@v7
        env:
          AUTHORIZATION_RUN_ID: ${{ inputs.authorization_run_id }}
        with:
          script: |
            const runId = Number(process.env.AUTHORIZATION_RUN_ID);
            const expectedRepository = `${context.repo.owner}/${context.repo.repo}`;
            if (!Number.isSafeInteger(runId) || runId <= 0) {
              core.setFailed("authorization_run_id must be a positive integer.");
              return;
            }
            const response = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const run = response.data;
            if (run.name !== "Promote staged digest for production" ||
                run.head_branch !== "main" || run.event !== "workflow_dispatch" ||
                run.status !== "completed" || run.conclusion !== "success" ||
                run.head_repository?.full_name !== expectedRepository) {
              core.setFailed(`Run ${runId} is not accepted production authorization.`);
              return;
            }
            // The authorization run's head_sha is the AUTHORIZING main commit
            // -- the workflow/verifier code that produced the document. It is
            // NOT the application revision being released; that lives inside
            // the typed authorization as release_revision.
            core.setOutput("authorization_main_sha", run.head_sha);

      # Verifier code comes from the authorizing main commit ...
      - name: Checkout authorized release-control verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.authorization-run.outputs.authorization_main_sha }}

      - name: Download exact production authorization
        uses: actions/download-artifact@v4
        with:
          pattern: production-authorization-*
          path: ${{ runner.temp }}/authorization
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.authorization_run_id }}

      - name: Verify typed production authorization
        id: evidence
        env:
          AUTHORIZATION_RUN_ID: ${{ inputs.authorization_run_id }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find "$RUNNER_TEMP/authorization" -type f -name authorization.json)
          test "${#files[@]}" -eq 1
          python -m scripts.release_candidate_evidence verify-production \
            --path "${files[0]}" \
            --expected-authorization-run-id "$AUTHORIZATION_RUN_ID" \
            --expected-authorization-main-revision "${{ steps.authorization-run.outputs.authorization_main_sha }}" \
            --github-output "$GITHUB_OUTPUT"

  deploy:
    needs: verify
    runs-on: [self-hosted, linux, x64, dotmac-sub-production]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    environment: production
    # The deploy's backup, migrations, warm handoff and existing health gates
    # share this job budget. Individual health/schema/identity limits remain
    # unchanged and continue to fail closed.
    timeout-minutes: 120
    steps:
      # This job deploys to the live production host (backup, migrations, the
      # actual container cutover) after a human approval, so it must never be
      # attempted a second time under the same run: a rerun after a partial
      # failure would re-enter the approval gate and re-execute the deploy
      # rather than going through `resume_after_migration` (a fresh dispatch,
      # named prior failed run and backup path) or a new authorization run.
      # Mirrors the same refusal already enforced by
      # infrastructure-reconcile-apply.yml and
      # legacy-image-pin-bootstrap-apply.yml's `apply` jobs. Scoped to `deploy`
      # only: `verify` above has no `environment:` approval gate and is
      # read-only (no host mutation), so it is safely re-runnable.
      - name: Refuse a rerun of this approval-gated deploy
        uses: actions/github-script@v7
        env:
          RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            if (process.env.RUN_ATTEMPT !== "1") {
              core.setFailed(
                "Deploy reruns are not admissible: a partial failure after " +
                "production approval must be re-dispatched as a new run from " +
                "candidate build forward (or resumed via resume_after_migration " +
                "on a fresh dispatch), not rerun in place."
              );
            }

      # Read this exact deploy job's server-recorded start time. A runner-local
      # timestamp here would silently add step/runner startup time to the
      # bounded production window.
      - name: Capture production job deadline
        id: job-budget
        uses: actions/github-script@v7
        with:
          script: |
            const result = await github.rest.actions.listJobsForWorkflowRunAttempt({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              run_attempt: context.runAttempt,
              per_page: 100,
            });
            const matches = result.data.jobs.filter((job) => job.name === "deploy");
            if (matches.length !== 1 || matches[0].status !== "in_progress" ||
                typeof matches[0].started_at !== "string") {
              core.setFailed("Exact production deploy job start time is unavailable.");
              return;
            }
            const started = Date.parse(matches[0].started_at);
            if (!Number.isFinite(started) || started > Date.now()) {
              core.setFailed("Exact production deploy job start time is malformed.");
              return;
            }
            core.setOutput("deadline_epoch", String(Math.floor(started / 1000) + 120 * 60));

      # This checkout is pinned to the already-verified authorizing main SHA.
      # Its gate runs before the separately checked-out staged release wrapper.
      - name: Checkout trusted production control
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.authorization_main_revision }}
          fetch-depth: 0
          path: trusted-control

      - name: Download exact production authorization
        uses: actions/download-artifact@v4
        with:
          pattern: production-authorization-*
          path: ${{ runner.temp }}/authorization
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.authorization_run_id }}

      - name: Prepare typed transition authorization with trusted control
        env:
          AUTHORIZATION_RUN_ID: ${{ inputs.authorization_run_id }}
          AUTHORIZATION_MAIN_REVISION: ${{ needs.verify.outputs.authorization_main_revision }}
          ROLLBACK_FROM: ${{ inputs.rollback_from_revision }}
          ROLLBACK_TO: ${{ inputs.rollback_to_revision }}
          ROLLBACK_REF: ${{ inputs.rollback_change_reference }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
          BOOTSTRAP_TARGET: ${{ inputs.bootstrap_target_revision }}
          BOOTSTRAP_REF: ${{ inputs.bootstrap_change_reference }}
          BOOTSTRAP_REASON: ${{ inputs.bootstrap_reason }}
        run: |
          set -euo pipefail
          control="$GITHUB_WORKSPACE/trusted-control"
          mapfile -t files < <(find "$RUNNER_TEMP/authorization" -type f -name authorization.json)
          test "${#files[@]}" -eq 1
          rollback_args=()
          if [ -n "$ROLLBACK_FROM$ROLLBACK_TO$ROLLBACK_REF$ROLLBACK_REASON" ]; then
            if [ -z "$ROLLBACK_FROM" ] || [ -z "$ROLLBACK_TO" ] \
              || [ -z "$ROLLBACK_REF" ] || [ -z "$ROLLBACK_REASON" ]; then
              echo "A rollback authorization requires from-revision, to-revision, change reference and reason." >&2
              exit 1
            fi
            (cd "$control" && python -m scripts.release_candidate_evidence write-rollback-authorization \
              --from-revision "$ROLLBACK_FROM" --to-revision "$ROLLBACK_TO" \
              --change-reference "$ROLLBACK_REF" --reason "$ROLLBACK_REASON" \
              --output "$RUNNER_TEMP/rollback-authorization.json")
            rollback_args+=(--rollback-authorization "$RUNNER_TEMP/rollback-authorization.json")
          fi
          bootstrap_args=()
          if [ -n "$BOOTSTRAP_TARGET$BOOTSTRAP_REF$BOOTSTRAP_REASON" ]; then
            if [ -z "$BOOTSTRAP_TARGET" ] || [ -z "$BOOTSTRAP_REF" ] \
              || [ -z "$BOOTSTRAP_REASON" ]; then
              echo "A bootstrap authorization requires target revision, change reference and reason." >&2
              exit 1
            fi
            if [ -n "$ROLLBACK_FROM$ROLLBACK_TO$ROLLBACK_REF$ROLLBACK_REASON" ]; then
              echo "Rollback and first-deployment bootstrap authorizations are mutually exclusive." >&2
              exit 1
            fi
            (cd "$control" && python -m scripts.release_candidate_evidence write-bootstrap-authorization \
              --target-revision "$BOOTSTRAP_TARGET" --target-server "dotmac-sub-prod" \
              --change-reference "$BOOTSTRAP_REF" --reason "$BOOTSTRAP_REASON" \
              --output "$RUNNER_TEMP/bootstrap-authorization.json")
            bootstrap_args+=(--bootstrap-authorization "$RUNNER_TEMP/bootstrap-authorization.json")
          fi
          # Admission and the staged wrapper run together later under one
          # trusted lock. This step only creates typed evidence documents.

      # The staged checkout is inert source data. The trusted supervisor below
      # proves the transition before invoking any staged executable.
      - name: Checkout authorized staged release
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.release_revision }}
          fetch-depth: 0
          path: staged-release

      - name: Verify production host contract
        env:
          PRODUCTION_DEPLOY_DIR: ${{ vars.PRODUCTION_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          test -n "$PRODUCTION_DEPLOY_DIR"
          test -f "$PRODUCTION_DEPLOY_DIR/.env"
          grep -Fqx 'APP_ENV=production' "$PRODUCTION_DEPLOY_DIR/.env"
          grep -Fqx 'SERVER_NAME=dotmac-sub-prod' "$PRODUCTION_DEPLOY_DIR/.env"

      - name: Deploy authorized digest
        env:
          PRODUCTION_DEPLOY_DIR: ${{ vars.PRODUCTION_DEPLOY_DIR }}
          IMAGE_DIGEST: ${{ needs.verify.outputs.image_digest }}
          HOTFIX: ${{ inputs.hotfix_no_migrations }}
          CHANGE_REFERENCE: ${{ inputs.change_reference }}
          HOTFIX_REASON: ${{ inputs.reason }}
          ROLLBACK_FROM: ${{ inputs.rollback_from_revision }}
          ROLLBACK_TO: ${{ inputs.rollback_to_revision }}
          ROLLBACK_REF: ${{ inputs.rollback_change_reference }}
          ROLLBACK_REASON: ${{ inputs.rollback_reason }}
          BOOTSTRAP_TARGET: ${{ inputs.bootstrap_target_revision }}
          BOOTSTRAP_REF: ${{ inputs.bootstrap_change_reference }}
          BOOTSTRAP_REASON: ${{ inputs.bootstrap_reason }}
          RESUME_AFTER_MIGRATION: ${{ inputs.resume_after_migration }}
          FAILED_DEPLOYMENT_RUN_ID: ${{ inputs.failed_deployment_run_id }}
          PRIOR_BACKUP_PATH: ${{ inputs.prior_backup_path }}
          AUTHORIZATION_RUN_ID: ${{ inputs.authorization_run_id }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          PRODUCTION_DEPLOY_DEADLINE_EPOCH: ${{ steps.job-budget.outputs.deadline_epoch }}
          DB_BACKUP_BASENAME: dotmac_sub_run_${{ github.run_id }}
          DB_BACKUP_RETENTION_PREFIX: dotmac_sub_run_
          DB_BACKUP_RETENTION_COUNT: "5"
        run: |
          set -euo pipefail
          control="$GITHUB_WORKSPACE/trusted-control"
          staged="$GITHUB_WORKSPACE/staged-release"
          mapfile -t files < <(find "$RUNNER_TEMP/authorization" -type f -name authorization.json)
          test "${#files[@]}" -eq 1
          args=(
            --production-authorization "${files[0]}"
            --authorization-run-id "$AUTHORIZATION_RUN_ID"
            --authorization-main-revision "${{ needs.verify.outputs.authorization_main_revision }}"
            --target-revision "${{ needs.verify.outputs.release_revision }}"
            --target-image-digest "$IMAGE_DIGEST"
            --deploy-directory "$PRODUCTION_DEPLOY_DIR"
            --staged-repository "$staged"
            --control-repository "$control"
          )
          # A rollback is authorized by NAMING the exact transition, never by
          # setting a flag. Partial attribution is refused rather than being
          # quietly treated as "no rollback intended".
          if [ -n "$ROLLBACK_FROM$ROLLBACK_TO$ROLLBACK_REF$ROLLBACK_REASON" ]; then
            if [ -z "$ROLLBACK_FROM" ] || [ -z "$ROLLBACK_TO" ] \
              || [ -z "$ROLLBACK_REF" ] || [ -z "$ROLLBACK_REASON" ]; then
              echo "A rollback authorization requires from-revision, to-revision, change reference and reason." >&2
              exit 1
            fi
            args+=(--rollback-authorization "$RUNNER_TEMP/rollback-authorization.json")
          fi
          # Bootstrap is a distinct, typed authority for a confirmed empty
          # host. Naming the exact revision prevents this from becoming a
          # reusable "skip anti-rollback" flag.
          if [ -n "$BOOTSTRAP_TARGET$BOOTSTRAP_REF$BOOTSTRAP_REASON" ]; then
            if [ -z "$BOOTSTRAP_TARGET" ] || [ -z "$BOOTSTRAP_REF" ] \
              || [ -z "$BOOTSTRAP_REASON" ]; then
              echo "A bootstrap authorization requires target revision, change reference and reason." >&2
              exit 1
            fi
            if [ -n "$ROLLBACK_FROM$ROLLBACK_TO$ROLLBACK_REF$ROLLBACK_REASON" ]; then
              echo "Rollback and first-deployment bootstrap authorizations are mutually exclusive." >&2
              exit 1
            fi
            args+=(--bootstrap-authorization "$RUNNER_TEMP/bootstrap-authorization.json")
          fi
          if [ "$HOTFIX" = "true" ]; then
            args+=(--hotfix-change-reference "$CHANGE_REFERENCE" --hotfix-reason "$HOTFIX_REASON")
          elif [ -n "$CHANGE_REFERENCE" ] || [ -n "$HOTFIX_REASON" ]; then
            echo "Hotfix attribution was supplied without hotfix_no_migrations." >&2
            exit 1
          fi
          if [ "$RESUME_AFTER_MIGRATION" = "true" ]; then
            args+=(--resume-failed-run-id "$FAILED_DEPLOYMENT_RUN_ID" --resume-backup-path "$PRIOR_BACKUP_PATH")
          elif [ -n "$FAILED_DEPLOYMENT_RUN_ID" ] || [ -n "$PRIOR_BACKUP_PATH" ]; then
            echo "Resume evidence was supplied without resume_after_migration." >&2
            exit 1
          fi
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH="$control" python "$control/scripts/production_trusted_deploy.py" \
            "${args[@]}"
