name: Plan legacy image-pin bootstrap

# Read-only. This lane holds no production authority: it cannot mutate the
# host, and the identity it runs as has no Docker-socket write and only the one
# fixed observer sudo rule.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact protected-main SHA to inspect
        required: true
        type: string
      change_reference:
        description: Reviewed change reference (CHG-SUB-9001-CONTAINMENT-2026-09-01)
        required: true
        type: string
      reason:
        description: Why the legacy image-pin bootstrap is requested
        required: true
        type: string

permissions:
  contents: read

jobs:
  admit_read_only_plan:
    name: Require exact protected main for read-only planning
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      protected_sha: ${{ steps.main.outputs.protected_sha }}
    steps:
      - name: Refuse disabled, rerun or mutable dispatch
        env:
          ENABLED: ${{ vars.LEGACY_IMAGE_PIN_BOOTSTRAP_ENABLED }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$ENABLED" = "true" || { echo "bootstrap is disabled" >&2; exit 1; }
          test "$RUN_ATTEMPT" = "1" || { echo "reruns are not admissible" >&2; exit 1; }
          test "$EVENT_REF" = "refs/heads/main" || { echo "not protected main" >&2; exit 1; }
          test "$SOURCE_SHA" = "$EVENT_SHA" || { echo "source is not the dispatched head" >&2; exit 1; }
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$' || { echo "source is not a full SHA" >&2; exit 1; }

      - name: Observe current protected-main head
        id: main
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              owner: context.repo.owner, repo: context.repo.repo, branch: "main",
            });
            if (!data.protected) { core.setFailed("main is not protected"); return; }
            if (data.commit.sha !== process.env.SOURCE_SHA) {
              core.setFailed("protected main moved away from the requested source");
              return;
            }
            core.setOutput("protected_sha", data.commit.sha);

  plan:
    name: Read production state and emit the canonical bootstrap plan
    needs: admit_read_only_plan
    # This identity has no Docker-socket write and only the fixed observer
    # sudo rule.
    runs-on: [self-hosted, linux, x64, dotmac-sub-production-plan]
    timeout-minutes: 10
    steps:
      - name: Checkout exact protected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.admit_read_only_plan.outputs.protected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Produce read-only bootstrap plan
        env:
          PRODUCTION_DEPLOY_DIR: ${{ vars.PRODUCTION_DEPLOY_DIR }}
          PYTHON_BIN: ${{ vars.PUBLISHED_PORT_RECONCILE_PYTHON_BIN }}
          OUTPUT_DIR: ${{ runner.temp }}/legacy-image-pin-plan
          SOURCE_SHA: ${{ inputs.source_sha }}
          CHANGE_REFERENCE: ${{ inputs.change_reference }}
          REASON: ${{ inputs.reason }}
          PLAN_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$OUTPUT_DIR"
          REPO_DIR="$GITHUB_WORKSPACE" DEPLOY_DIR="$PRODUCTION_DEPLOY_DIR" \
            bash scripts/legacy_image_pin_bootstrap.sh plan \
              --source-sha "$SOURCE_SHA" \
              --change-reference "$CHANGE_REFERENCE" \
              --reason "$REASON" \
              --run-id "$PLAN_RUN_ID" \
              --output-dir "$OUTPUT_DIR"

      - name: Upload canonical plan and artifact receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: legacy-image-pin-plan-v1-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/legacy-image-pin-plan/
          if-no-files-found: error
          retention-days: 1
