name: Reconcile main into dev

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-dev-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Open main-to-dev reconciliation PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Build reconciliation merge
        id: reconciliation
        env:
          SYNC_BRANCH: automation/sync-main-to-dev
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            main:refs/remotes/origin/main \
            dev:refs/remotes/origin/dev
          if git merge-base --is-ancestor origin/main origin/dev; then
            echo "origin/dev already contains origin/main."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          remote_sync_sha="$(
            git ls-remote --heads origin "refs/heads/$SYNC_BRANCH" |
              awk 'NR == 1 {print $1}'
          )"
          if [ -n "$remote_sync_sha" ]; then
            git fetch --no-tags origin \
              "+refs/heads/$SYNC_BRANCH:refs/remotes/origin/$SYNC_BRANCH"
          fi

          git config user.name "dotmac-release-automation[bot]"
          git config user.email "dotmac-release-automation@users.noreply.github.com"
          git checkout -B "$SYNC_BRANCH" origin/dev
          git merge --no-ff origin/main -m "chore: reconcile main into dev"

          echo "needed=true" >> "$GITHUB_OUTPUT"
          echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          echo "remote_sync_sha=$remote_sync_sha" >> "$GITHUB_OUTPUT"

      - name: Create release-automation token
        if: steps.reconciliation.outputs.needed == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_APP_PRIVATE_KEY }}

      - name: Push reconciliation branch
        if: steps.reconciliation.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REMOTE_SYNC_SHA: ${{ steps.reconciliation.outputs.remote_sync_sha }}
          SYNC_BRANCH: automation/sync-main-to-dev
        run: |
          set -euo pipefail
          gh auth setup-git
          if [ -n "$REMOTE_SYNC_SHA" ]; then
            git push \
              "--force-with-lease=refs/heads/$SYNC_BRANCH:$REMOTE_SYNC_SHA" \
              origin "HEAD:refs/heads/$SYNC_BRANCH"
          else
            git push \
              "--force-with-lease=refs/heads/$SYNC_BRANCH:" \
              origin "HEAD:refs/heads/$SYNC_BRANCH"
          fi

      - name: Open or update reconciliation PR
        if: steps.reconciliation.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          MAIN_SHA: ${{ steps.reconciliation.outputs.main_sha }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          SYNC_BRANCH: automation/sync-main-to-dev
        run: |
          set -euo pipefail
          body="$(
            printf '%s\n\n%s\n\n%s\n\n%s\n' \
              '## Summary' \
              "- merge authoritative main commit \`$MAIN_SHA\` into \`dev\`" \
              '- preserve all existing dev work and Git ancestry' \
              'Version impact: none because this PR only reconciles already-versioned main changes into dev.'
          )"
          pr_number="$(
            gh api --method GET "repos/$REPOSITORY/pulls" \
              -f state=open \
              -f base=dev \
              -f head="$REPOSITORY_OWNER:$SYNC_BRANCH" \
              --jq '.[0].number // empty'
          )"
          if [ -z "$pr_number" ]; then
            pr_number="$(
              gh api --method POST "repos/$REPOSITORY/pulls" \
                -f title='chore: reconcile main into dev' \
                -f head="$SYNC_BRANCH" \
                -f base=dev \
                -f body="$body" \
                --jq '.number'
            )"
          else
            gh api --silent --method PATCH \
              "repos/$REPOSITORY/pulls/$pr_number" \
              -f title='chore: reconcile main into dev' \
              -f body="$body"
          fi
          gh api --silent --method POST \
            "repos/$REPOSITORY/issues/$pr_number/labels" \
            -f 'labels[]=version:none'
