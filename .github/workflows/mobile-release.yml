name: Mobile Release

# Signed release builds. Manual (workflow_dispatch) or on a mobile version tag
# like `mobile-v1.0.0`. Never runs on PRs — it needs signing + DSN secrets.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Build artifact (appbundle for Play, apk for sideload)"
        type: choice
        options: [appbundle, apk]
        default: appbundle
  push:
    tags:
      - "mobile-v*"

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CUSTOMER_ANDROID_BUILD_TOOLS_VERSION: "36.0.0"

jobs:
  android-release:
    name: Android signed release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Require all Customer signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required repository secret '$name' is not set. See mobile/README.md."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          for leftover in android/key.properties android/app/release.jks; do
            [ ! -e "$leftover" ] || { echo "::error::Stale signing material exists: $leftover"; exit 1; }
          done

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install pinned Android build tools
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "$SDK" ] || { echo "::error::Android SDK missing."; exit 1; }
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || { echo "::error::Android sdkmanager missing."; exit 1; }
          "$SDKMANAGER" "build-tools;$CUSTOMER_ANDROID_BUILD_TOOLS_VERSION"
          BT="$SDK/build-tools/$CUSTOMER_ANDROID_BUILD_TOOLS_VERSION"
          [ -x "$BT/apksigner" ] && [ -x "$BT/aapt2" ] || {
            echo "::error::Pinned Android verification tools unavailable."; exit 1;
          }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Reconstruct the keystore + key.properties from secrets. The keystore is
      # stored base64-encoded in ANDROID_KEYSTORE_BASE64; the gradle config reads
      # android/key.properties (see android/app/build.gradle.kts).
      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          [ -s android/app/release.jks ] || { echo "::error::Empty signing keystore."; exit 1; }
          keytool -list -keystore android/app/release.jks -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD > /dev/null 2>&1 || {
              echo "::error::Upload keystore password or alias is invalid."; exit 1;
            }
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.jks
          EOF

      # Brand/config values come from the committed brand.json; the GlitchTip DSN
      # is injected from a secret (kept out of the repo). A later --dart-define
      # overrides the same key from --dart-define-from-file.
      - name: Build signed ${{ github.event.inputs.track || 'appbundle' }}
        env:
          GLITCHTIP_DSN: ${{ secrets.MOBILE_GLITCHTIP_DSN }}
          TRACK: ${{ github.event.inputs.track || 'appbundle' }}
        run: |
          set -euo pipefail
          flutter build "$TRACK" --release \
            --dart-define-from-file=../brand.json \
            --dart-define=GLITCHTIP_DSN="$GLITCHTIP_DSN"

      - name: Verify the artifact signature and Customer application id
        id: verified-artifact
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TRACK: ${{ github.event.inputs.track || 'appbundle' }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          [ -n "$SDK" ] || { echo "::error::Android SDK missing."; exit 1; }
          BT="$SDK/build-tools/$CUSTOMER_ANDROID_BUILD_TOOLS_VERSION"
          [ -x "$BT/apksigner" ] && [ -x "$BT/aapt2" ] || {
            echo "::error::Required Android build-tools $CUSTOMER_ANDROID_BUILD_TOOLS_VERSION missing."; exit 1;
          }
          case "$TRACK" in
            appbundle) ART=build/app/outputs/bundle/release/app-release.aab ;;
            apk) ART=build/app/outputs/flutter-apk/app-release.apk ;;
            *) echo "::error::Unsupported release track."; exit 1 ;;
          esac
          python3 ../scripts/verify_customer_android_release.py \
            --artifact "$ART" --keystore android/app/release.jks \
            --key-alias "$ANDROID_KEY_ALIAS" --build-tools "$BT"
          printf 'path=mobile/%s\n' "$ART" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotmac-android-release
          path: ${{ steps.verified-artifact.outputs.path }}
          if-no-files-found: error

      - name: Clean up signing material
        if: always()
        run: rm -f android/app/release.jks android/key.properties

  # iOS release archive needs Apple signing credentials (cert + provisioning
  # profile) that aren't wired here yet. Kept as a documented, manually-gated
  # job so the pipeline shape is in place; it fails fast with guidance until the
  # Apple secrets are configured.
  ios-release:
    name: iOS signed archive
    runs-on: macos-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Gate on Apple signing secrets
        run: |
          echo "::error::iOS release signing not configured. Add the Apple"
          echo "distribution certificate + provisioning profile as secrets and"
          echo "wire fastlane match / xcode signing, then enable this job."
          exit 1
