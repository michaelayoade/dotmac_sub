name: Material partial issue authoring
on:
  push:
    branches: ['fix/erp-material-partial-issue-projection']
    paths: ['.github/workflows/material-partial-authoring.yml']
permissions:
  contents: read
concurrency:
  group: material-partial-authoring-sub
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'michaelayoade/dotmac_sub' && github.ref == 'refs/heads/fix/erp-material-partial-issue-projection'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      BRANCH: fix/erp-material-partial-issue-projection
      DATABASE_URL: sqlite:///./test.db
      REDIS_URL: redis://127.0.0.1:9/0
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      DOTMAC_DEV_MODE: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Verify exact source and apply reviewed changes
        id: apply
        run: |
          python - <<'PY'
          import ast, base64, gzip, hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          expected = ['b22e921367bb0aecd55aa37f43cc8b42b23e1cd2', 'd2a9e80e27bd648e9f7ff48f32c94e2ea2eab72e', '9d4b8a703fc094026759c5a69edd6950b4c96e3e', '61539a7817e3ba19ca78cdb82f8334bebaa460b9', '879baf88eedbb75cb4e254258a503b86925f0d5e']
          parts = sorted(pathlib.Path('.github/material-partial').glob('*.b64'))
          assert len(parts) == len(expected), 'Patch part count mismatch'
          for path, wanted in zip(parts, expected, strict=True):
              data = path.read_bytes()
              actual = hashlib.sha1(f'blob {len(data)}\0'.encode() + data).hexdigest()
              assert actual == wanted, f'Patch part mismatch: {path}: {actual}'
          encoded = ''.join(p.read_text().strip() for p in parts) + '\n'
          assert hashlib.sha256(encoded.encode()).hexdigest() == 'a860d521a24c060a6c8f88d6e7e28eacf427e09fa45770f1256086d2476b0f8a'
          payload = json.loads(gzip.decompress(base64.b64decode(encoded)))
          for name, wanted in payload['sha256_before'].items():
              path = root / name
              assert path.resolve().is_relative_to(root) and not path.is_symlink()
              if wanted is None:
                  assert not path.exists(), f'New path already exists: {name}'
              else:
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == wanted, f'Source changed: {name}'
          patch = temp / 'material.patch'
          patch.write_text(payload['patch'])
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          for name in payload['changed']:
              if name.endswith('.py'):
                  ast.parse((root / name).read_text(), filename=name)
          (temp / 'material-changed.json').write_text(json.dumps(payload['changed']))
          print('Verified and applied', len(payload['changed']), 'reviewed source files')
          PY
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263
        with:
          version: '2.4.1'
          virtualenvs-create: true
          virtualenvs-in-project: true
      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-3.12.13-${{ hashFiles('poetry.lock') }}
      - name: Install repository-locked development dependencies
        id: dependencies
        env:
          POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
          POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: poetry install --no-interaction
      - name: Pinned Python format and lint
        id: python_checks
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          paths = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'material-changed.json').read_text())
          files = [p for p in paths if p.endswith('.py')]
          subprocess.run(['poetry', 'run', 'ruff', 'format', *files], check=True)
          subprocess.run(['poetry', 'run', 'ruff', 'check', '--fix', *files], check=True)
          PY
      - name: Regenerate authoritative contract manifests
        id: manifests
        run: |
          poetry run python -m scripts.architecture.sot_manifest_docs --write
          poetry run python scripts/update_openapi_contract.py
      - name: Focused server regressions
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          poetry run pytest -q tests/test_material_partial_fulfillment.py tests/test_dotmac_erp_material_sync.py tests/test_erp_material_webhook.py tests/test_field_material_requests.py tests/architecture/test_openapi_contract_surface.py 2>&1 | tee "$RUNNER_TEMP/material-python-tests.txt"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - name: Format and test the field-mobile material view
        id: mobile
        continue-on-error: true
        run: |
          set -o pipefail
          cd field_mobile
          flutter pub get
          dart format lib/features/materials/material_models.dart lib/features/materials/materials_screen.dart test/materials_test.dart
          flutter test test/materials_test.dart 2>&1 | tee "$RUNNER_TEMP/material-mobile-tests.txt"
      - name: Publish source on the feature branch and remove temporary authoring files
        id: publish
        if: always() && steps.apply.outcome == 'success'
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          assert os.environ['GITHUB_REPOSITORY'] == 'michaelayoade/dotmac_sub'
          assert os.environ['GITHUB_REF'] == 'refs/heads/fix/erp-material-partial-issue-projection'
          names = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'material-changed.json').read_text())
          names += ['tests/architecture/openapi_contract_surface.json', 'docs/SOT_RELATIONSHIP_MAP.md']
          temporary = ['.github/workflows/material-partial-authoring.yml'] + [str(p) for p in pathlib.Path('.github/material-partial').glob('*.b64')]
          for name in temporary:
              pathlib.Path(name).unlink()
          allowed = set(names + temporary)
          dirty = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          assert dirty <= allowed, f'Unexpected modified paths: {dirty - allowed}'
          subprocess.run(['git', 'fetch', 'origin', os.environ['BRANCH']], check=True)
          assert subprocess.check_output(['git', 'rev-parse', 'FETCH_HEAD'], text=True).strip() == os.environ['GITHUB_SHA'], 'Feature branch advanced; refusing overwrite'
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          subprocess.run(['git', '-c', 'user.name=github-actions[bot]', '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com', 'commit', '-m', 'fix(materials): project cumulative ERP partial fulfillment without closing outstanding requests'], check=True)
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + os.environ['BRANCH']], check=True)
          subprocess.run(['git', 'rev-parse', 'HEAD'], check=True)
          PY
      - name: Record validation outcome
        if: always()
        env:
          APPLY: ${{ steps.apply.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          PYTHON_CHECKS: ${{ steps.python_checks.outcome }}
          MANIFESTS: ${{ steps.manifests.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          MOBILE: ${{ steps.mobile.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          printf 'Apply: %s\nDependencies: %s\nPython: %s\nManifests: %s\nServer tests: %s\nMobile: %s\nPublish: %s\nFull CI and PostgreSQL/staging acceptance remain required.\n' "$APPLY" "$DEPENDENCIES" "$PYTHON_CHECKS" "$MANIFESTS" "$TESTS" "$MOBILE" "$PUBLISH" | tee "$RUNNER_TEMP/material-status.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-validation
          path: |
            ${{ runner.temp }}/material-status.txt
            ${{ runner.temp }}/material-python-tests.txt
            ${{ runner.temp }}/material-mobile-tests.txt
          retention-days: 2
      - name: Fail honestly when any required focused validation did not pass
        if: always()
        env:
          VALIDATION_OK: ${{ steps.python_checks.outcome == 'success' && steps.manifests.outcome == 'success' && steps.tests.outcome == 'success' && steps.mobile.outcome == 'success' && steps.publish.outcome == 'success' }}
        run: test "$VALIDATION_OK" = 'true'
