name: Start approved release for PR 3186
run-name: Start PR 3186 release with version 8.55.0

# One-shot dispatch adapter on an unmerged operations branch. This replaces
# the pre-version candidate request; it never edits main, tags or release gates.
on:
  push:
    branches: [ops/start-release-3186-20260918]
    paths: [.github/workflows/start-release-3186.yml]

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: start-release-b0f51c12bbd3013fe7c8453fafabf11f32aa68af
  cancel-in-progress: true

jobs:
  start:
    name: Require version merge and start the green versioned candidate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Require approved version merge, exact-main CI and matching release tag
        uses: actions/github-script@v7
        env:
          SOURCE_MERGE_SHA: b0f51c12bbd3013fe7c8453fafabf11f32aa68af
          VERSION_PR_HEAD: fad2ce12f9ee8a02e85c097a31f34e288e804743
          RELEASE_VERSION: 8.55.0
          STAGING_AUTO_ENABLED: ${{ vars.STAGING_AUTO_DEPLOY_ENABLED }}
        with:
          retries: 0
          script: |
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            if (context.repo.owner !== 'michaelayoade' || context.repo.repo !== 'dotmac_sub') {
              throw new Error('Unexpected repository; refusing dispatch.');
            }
            const sourceMerge = process.env.SOURCE_MERGE_SHA;
            const versionHead = process.env.VERSION_PR_HEAD;
            const version = process.env.RELEASE_VERSION;
            const deadline = Date.now() + 50 * 60 * 1000;
            const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
            const sourcePR = (await github.rest.pulls.get({...repo, pull_number: 3186})).data;
            if (!sourcePR.merged || sourcePR.merge_commit_sha !== sourceMerge) {
              throw new Error('The approved consolidation merge changed.');
            }
            await core.summary.addHeading('Approved release: PR #3186 plus version PR #3184')
              .addRaw(`Required release version: ${version}\n\n`)
              .addRaw('This adapter replaces the pre-version request. It requires the version PR to be merged, exact-main CI to pass, and the release tag to name that commit. No production authorization is performed.\n\n')
              .addRaw(`Configured automatic staging: ${process.env.STAGING_AUTO_ENABLED === 'true'}\n\n`)
              .write();
            let candidate;
            while (!candidate) {
              const bump = (await github.rest.pulls.get({...repo, pull_number: 3184})).data;
              if (bump.head.sha !== versionHead || bump.base.ref !== 'main') {
                throw new Error('Version PR changed; inspect its new revision before dispatch.');
              }
              if (bump.merged) {
                candidate = bump.merge_commit_sha;
                break;
              }
              if (bump.state !== 'open' || Date.now() >= deadline) {
                throw new Error('Approved version PR was not merged; no build dispatched.');
              }
              core.info('Waiting for the approved version PR #3184 to be merged.');
              await delay(20000);
            }
            if (!/^[0-9a-f]{40}$/.test(candidate)) throw new Error('Expected exact merge SHA.');
            async function requireCurrentMain() {
              const branch = (await github.rest.repos.getBranch({...repo, branch: 'main'})).data;
              if (branch.commit.sha !== candidate) {
                throw new Error(`Main moved to ${branch.commit.sha}; refusing candidate ${candidate}.`);
              }
            }
            await requireCurrentMain();
            const comparison = (await github.rest.repos.compareCommitsWithBasehead({
              ...repo, basehead: `${sourceMerge}...${candidate}`,
            })).data;
            if (comparison.status !== 'ahead' || comparison.behind_by !== 0) {
              throw new Error('Versioned candidate does not retain the consolidation merge.');
            }
            const versionFile = (await github.rest.repos.getContent({
              ...repo, path: 'VERSION', ref: candidate,
            })).data;
            if (versionFile.type !== 'file' || Buffer.from(versionFile.content, 'base64').toString('utf8').trim() !== version) {
              throw new Error('Candidate VERSION does not match the approved version bump.');
            }
            await core.summary.addRaw(`Version PR merged. Exact release candidate: ${candidate}\n\n`).write();
            const required = ['CI', 'Mobile CI'];
            let previous = '';
            while (true) {
              await requireCurrentMain();
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                ...repo, head_sha: candidate, event: 'push', per_page: 100,
              });
              const runs = response.data.workflow_runs.filter(run =>
                run.head_sha === candidate && run.head_branch === 'main' && run.event === 'push'
              );
              const latest = required.map(name => runs.filter(run => run.name === name)
                .sort((left, right) => right.id - left.id)[0]);
              const status = required.map((name, index) => {
                const run = latest[index];
                return `${name}: ${run ? `${run.status}/${run.conclusion || 'pending'} (run ${run.id})` : 'not reported'}`;
              }).join('; ');
              if (status !== previous) {
                core.info(status);
                await core.summary.addRaw(`${status}\n\n`).write();
                previous = status;
              }
              if (latest.some(run => run && run.status === 'completed' && run.conclusion !== 'success')) {
                throw new Error(`Exact-main checks did not pass: ${status}`);
              }
              if (latest.every(run => run && run.status === 'completed' && run.conclusion === 'success')) break;
              if (Date.now() >= deadline) throw new Error(`No green candidate within this run: ${status}`);
              await delay(20000);
            }
            const tag = (await github.rest.git.getRef({...repo, ref: `tags/v${version}`})).data;
            let tagObject = tag.object;
            for (let depth = 0; tagObject.type === 'tag' && depth < 5; depth++) {
              tagObject = (await github.rest.git.getTag({...repo, tag_sha: tagObject.sha})).data.object;
            }
            if (tagObject.type !== 'commit' || tagObject.sha !== candidate) {
              throw new Error('Release tag does not name the versioned candidate; no dispatch.');
            }
            async function candidateRuns() {
              const response = await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: 'release-candidate.yml', head_sha: candidate,
                branch: 'main', event: 'workflow_dispatch', per_page: 100,
              });
              return response.data.workflow_runs.filter(run => run.head_sha === candidate &&
                run.head_branch === 'main' && run.event === 'workflow_dispatch')
                .sort((left, right) => right.id - left.id);
            }
            const existing = await candidateRuns();
            if (existing.length > 0) {
              const run = existing[0];
              await core.summary.addLink('Existing versioned candidate build', run.html_url).addEOL().write();
              core.setOutput('candidate_run_id', String(run.id));
              if (run.status === 'completed' && run.conclusion !== 'success') {
                throw new Error('Existing candidate attempt failed; inspect instead of duplicating it.');
              }
              return;
            }
            const releaseNames = new Set([
              'Build release candidate once', 'Deploy main to staging',
              'Promote staged digest for production', 'Deploy authorized digest to production',
            ]);
            for (const status of ['queued', 'in_progress', 'waiting', 'pending', 'requested']) {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo,
                {...repo, status, per_page: 100});
              const active = runs.find(run => releaseNames.has(run.name));
              if (active) throw new Error(`Another release is active: ${active.html_url}. No duplicate dispatch.`);
            }
            await requireCurrentMain();
            await github.rest.actions.createWorkflowDispatch({
              ...repo, workflow_id: 'release-candidate.yml', ref: 'main',
              inputs: {candidate_sha: candidate},
            });
            core.info(`Dispatched release-candidate.yml on main for ${candidate}, version ${version}.`);
            await core.summary.addRaw(`Build release candidate once dispatched for ${candidate}, version ${version}. The existing successful-build workflow owns automatic staging. Production remains a separate authorization.\n\n`).write();
            for (let attempt = 0; attempt < 24; attempt++) {
              const runs = await candidateRuns();
              if (runs.length > 0) {
                core.setOutput('candidate_run_id', String(runs[0].id));
                await core.summary.addLink('Versioned candidate build', runs[0].html_url).addEOL().write();
                return;
              }
              await delay(5000);
            }
            throw new Error('Dispatch accepted but run not yet visible; check existing runs before retrying.');
