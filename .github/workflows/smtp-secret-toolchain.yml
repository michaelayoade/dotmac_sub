name: Validate and publish SMTP credential repair
on:
  push:
    branches: ['work/smtp-secret-toolchain-20260916']
permissions:
  contents: write
  actions: read
concurrency:
  group: smtp-secret-repair-validation
  cancel-in-progress: true
env:
  BASE_SHA: 55a69bdce87772d19ab659a77385c3f65ffc1e20
  PATCH_SHA256: d6f49984d3d4016128bb641bc98d192940350df6f1217b1cc5d43f38cad63901
  FOLLOWUP_SHA256: 9d95edde2e291381d2a0beb9422565334c2b420878eb6bbca8a0d4154c6143cc
  DATABASE_URL: sqlite:///./test.db
  SECRET_KEY: ci-test-secret-key-not-for-production
  REDIS_URL: redis://127.0.0.1:9/0
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply only the reviewed patch to exact main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = ObiechinaJeffery
          mkdir -p "$RUNNER_TEMP/smtp-evidence"
          cat .github/smtp-validation/patch.gz.{0,1,2,3} | gzip -d > "$RUNNER_TEMP/smtp-evidence/repair.patch"
          echo "$PATCH_SHA256  $RUNNER_TEMP/smtp-evidence/repair.patch" | sha256sum -c -
          cp .github/smtp-validation/followup.patch "$RUNNER_TEMP/smtp-evidence/followup.patch"
          echo "$FOLLOWUP_SHA256  $RUNNER_TEMP/smtp-evidence/followup.patch" | sha256sum -c -
          git switch --detach "$BASE_SHA"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          git apply --check "$RUNNER_TEMP/smtp-evidence/repair.patch"
          git apply --index "$RUNNER_TEMP/smtp-evidence/repair.patch"
          git apply --index "$RUNNER_TEMP/smtp-evidence/followup.patch"
          git diff --cached --check
          git diff --cached --name-only | sort > "$RUNNER_TEMP/smtp-evidence/paths.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          expected = set('''app/services/admin_workflow_guidance.py
          app/services/email.py
          app/services/settings_kernel_bridge.py
          app/services/settings_spec.py
          app/services/smtp_contracts.py
          app/services/sot_registry/domains/feature_control_plane.py
          app/services/sot_registry/domains/notifications_communications.py
          app/services/team_inbox_outbound.py
          app/services/team_outbound.py
          app/services/web_system_export_tool.py
          app/tasks/notifications.py
          app/web/admin/system.py
          docs/ADMIN_OPERATIONS_GUIDE.md
          docs/SOT_RELATIONSHIP_MAP.md
          docs/runbooks/SMTP_SENDER_CREDENTIAL_RESOLUTION.md
          tests/architecture/test_smtp_credential_boundary.py
          tests/test_smtp_sender_credentials.py'''.splitlines())
          actual = set((Path(os.environ['RUNNER_TEMP'])/'smtp-evidence/paths.txt').read_text().splitlines())
          assert actual == expected, (actual - expected, expected - actual)
          PY
          git write-tree > "$RUNNER_TEMP/smtp-evidence/tree.txt"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore pinned dependency environment
        uses: actions/download-artifact@v4
        with:
          name: python-environment
          run-id: 35047151311
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/python-environment
      - name: Configure pinned Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -L .venv ]; then rm .venv; fi
          tar -xzf "$RUNNER_TEMP/python-environment/python-venv.tar.gz"
          tar -xzf "$RUNNER_TEMP/python-environment/poetry-home.tar.gz" -C "$HOME"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/poetry" config virtualenvs.create true
          "$HOME/.local/bin/poetry" config virtualenvs.in-project true
          .venv/bin/python --version
          .venv/bin/ruff --version
          test "$(git hash-object poetry.lock)" = a4ecd4f7203687c943815251ae287b7efca4f0c4
      - name: Reproduce ciphertext bug on unchanged main
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/smtp-baseline" "$BASE_SHA"
          cp tests/test_smtp_sender_credentials.py "$RUNNER_TEMP/smtp-baseline/tests/"
          PYTHON="$PWD/.venv/bin/python"
          cd "$RUNNER_TEMP/smtp-baseline"
          set +e
          "$PYTHON" -m pytest -q -o addopts= tests/test_smtp_sender_credentials.py::test_encrypted_named_password_resolves_in_fresh_session --junitxml="$RUNNER_TEMP/smtp-evidence/baseline.xml" > "$RUNNER_TEMP/smtp-evidence/baseline.log" 2>&1
          result=$?
          set -e
          cat "$RUNNER_TEMP/smtp-evidence/baseline.log"
          test "$result" = 1
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse(os.environ['RUNNER_TEMP']+'/smtp-evidence/baseline.xml').getroot()
          suites = list(root.iter('testsuite'))
          assert sum(int(s.get('tests', 0)) for s in suites) == 1
          assert sum(int(s.get('failures', 0)) for s in suites) == 1
          assert sum(int(s.get('errors', 0)) for s in suites) == 0
          PY
      - name: Run encryption, SMTP, UI and architecture regressions
        shell: bash
        run: |
          set -euo pipefail
          poetry run pytest -q -o addopts= tests/test_smtp_sender_credentials.py tests/test_secret_settings_at_rest.py tests/test_email_services.py tests/test_web_system_email.py tests/test_team_outbound.py tests/architecture/test_smtp_credential_boundary.py --junitxml="$RUNNER_TEMP/smtp-evidence/focused.xml" 2>&1 | tee "$RUNNER_TEMP/smtp-evidence/focused.log"
      - name: Full static and security validation
        shell: bash
        run: |
          set -euo pipefail
          poetry run ruff check app tests scripts alembic 2>&1 | tee "$RUNNER_TEMP/smtp-evidence/ruff.log"
          poetry run ruff format --check app tests scripts alembic 2>&1 | tee "$RUNNER_TEMP/smtp-evidence/format.log"
          poetry run mypy app --ignore-missing-imports --no-incremental 2>&1 | tee "$RUNNER_TEMP/smtp-evidence/mypy.log"
          poetry run lint-imports 2>&1 | tee "$RUNNER_TEMP/smtp-evidence/imports.log"
          poetry run bandit -r app -c pyproject.toml -q 2>&1 | tee "$RUNNER_TEMP/smtp-evidence/bandit.log"
          poetry run python -m compileall -q app tests scripts alembic
          poetry run python - <<'PY'
          import subprocess
          from pathlib import PurePosixPath
          from scripts.architecture.workflow_guidance_gate import validation_errors
          paths = tuple(PurePosixPath(p) for p in subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          errors = validation_errors(paths)
          assert not errors, errors
          print("Guidance gate passed for actual staged feature paths")
          PY
      - name: Full architecture suite
        shell: bash
        run: |
          set -euo pipefail
          make test-architecture 2>&1 | tee "$RUNNER_TEMP/smtp-evidence/architecture.log"
      - name: Full canonical unit suite
        shell: bash
        run: |
          set -euo pipefail
          make test UNIT_TEST_WORKERS=4 2>&1 | tee "$RUNNER_TEMP/smtp-evidence/unit.log"
      - name: Start disposable PostGIS database
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name smtp-repair-postgis -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=dotmac_sub_test -p 5432:5432 postgis/postgis:16-3.4
          for attempt in $(seq 1 30); do
            if docker exec smtp-repair-postgis pg_isready -h 127.0.0.1 -U postgres -d postgres; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Full migrated PostgreSQL suite and encrypted profile regression
        shell: bash
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dotmac_sub_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dotmac_sub_test
        run: |
          set -euo pipefail
          make test-integration 2>&1 | tee "$RUNNER_TEMP/smtp-evidence/postgresql.log"
          poetry run pytest -q -o addopts= tests/test_smtp_sender_credentials.py --junitxml="$RUNNER_TEMP/smtp-evidence/postgresql-smtp.xml" 2>&1 | tee "$RUNNER_TEMP/smtp-evidence/postgresql-smtp.log"
      - name: Commit and push only validated feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTOR" = ObiechinaJeffery
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git diff --exit-code
          test "$(git write-tree)" = "$(cat "$RUNNER_TEMP/smtp-evidence/tree.txt")"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_SHA"
          test -z "$(git ls-remote origin refs/heads/fix/smtp-sender-secret-resolution)"
          git config user.name ObiechinaJeffery
          git config user.email 97806905+ObiechinaJeffery@users.noreply.github.com
          git commit -m 'fix(email): resolve encrypted named SMTP credentials before authentication'
          git rev-parse HEAD > "$RUNNER_TEMP/smtp-evidence/commit.txt"
          git push origin HEAD:refs/heads/fix/smtp-sender-secret-resolution
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smtp-secret-repair-evidence
          path: ${{ runner.temp }}/smtp-evidence/
          retention-days: 7
          if-no-files-found: error
      - name: Remove disposable database
        if: always()
        run: docker rm -f smtp-repair-postgis || true
