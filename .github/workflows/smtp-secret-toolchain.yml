name: Prepare SMTP regression toolchain
on:
  push:
    branches: ['work/smtp-secret-toolchain-20260916']
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 55a69bdce87772d19ab659a77385c3f65ffc1e20
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Package interpreter and exact source, never environment secrets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 55a69bdce87772d19ab659a77385c3f65ffc1e20
          mkdir -p "$RUNNER_TEMP/smtp-toolchain"
          tar -czf "$RUNNER_TEMP/smtp-toolchain/python-3.12.13.tar.gz" -C "$pythonLocation" .
          git bundle create "$RUNNER_TEMP/smtp-toolchain/main-source.bundle" HEAD
          sha256sum "$RUNNER_TEMP/smtp-toolchain/"* > "$RUNNER_TEMP/smtp-toolchain/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: smtp-regression-toolchain
          path: ${{ runner.temp }}/smtp-toolchain/
          retention-days: 1
          if-no-files-found: error
