name: Consolidation diagnostics
on:
  push:
    branches: ['chore/consolidation-workbench-20260915']
    paths: ['.github/workflows/consolidation-diagnostics.yml']
permissions:
  contents: read
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download existing source check logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consolidation-diagnostics/logs" "$RUNNER_TEMP/consolidation-diagnostics/tools"
          for job in 104321613148 104328666690 104328666796 104328666706 104328378105 104328666616 104328378055 104328300956 104328666725; do
            gh api --allow-escape-sequences "repos/${GITHUB_REPOSITORY}/actions/jobs/${job}/logs" > "$RUNNER_TEMP/consolidation-diagnostics/logs/${job}.log"
          done
          python -m pip download --only-binary=:all: --no-deps ruff==0.15.0 -d "$RUNNER_TEMP/consolidation-diagnostics/tools"
      - uses: actions/upload-artifact@v4
        with:
          name: consolidation-diagnostics
          path: ${{ runner.temp }}/consolidation-diagnostics/
          retention-days: 3
          if-no-files-found: error
