name: Leads date filter development workspace
on:
  push:
    branches: [feat/sales-leads-date-filter]
    paths: [.github/workflows/leads-date-filter-workspace.yml]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'michaelayoade/dotmac_sub' && github.ref == 'refs/heads/feat/sales-leads-date-filter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export tracked development source
        run: git archive --format=tar HEAD -o "$RUNNER_TEMP/leads-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: leads-date-filter-source
          path: ${{ runner.temp }}/leads-source.tar
          retention-days: 1
