name: Argon2id single-operation benchmark

# Synthetic measurements are explicit evidence runs, never ordinary CI or
# application policy. No deployment or application credentials are inputs.
on:
  workflow_dispatch:
    inputs:
      execute:
        description: Run the bounded synthetic hashing workload
        required: true
        default: false
        type: boolean
      samples:
        description: Measured samples per grid point (1 to 100)
        required: true
        default: '10'
        type: string

permissions:
  contents: read

concurrency:
  group: argon2id-single-operation-benchmark
  cancel-in-progress: false

jobs:
  measure:
    name: Measure synthetic Argon2id on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_VERSION: '3.12.13'
      POETRY_VERSION: '2.4.1'
    steps:
      - name: Require explicit execution from main
        env:
          WORKFLOW_REF: ${{ github.ref }}
          EXECUTE: ${{ inputs.execute }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = refs/heads/main
          test "$EXECUTE" = true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install the locked environment
        env:
          POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
          POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -L .venv ]; then
            rm .venv
          fi
          poetry install --no-interaction

      - name: Measure the bounded synthetic grid
        env:
          SAMPLES: ${{ inputs.samples }}
        run: |
          set -euo pipefail
          # Request validates the sample bound before creating a native hasher.
          # The external limit can stop a native call after the internal deadline.
          timeout --signal=TERM --kill-after=5s 130s \
            poetry run python -m scripts.security.argon2id_benchmark \
              --mode microbench --execute --samples "$SAMPLES" \
              --warmups 1 --max-seconds 120 > argon2id-single-op.json

      - name: Preserve complete measurements with exact source provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: argon2id-single-op-${{ github.sha }}-${{ github.run_id }}
          path: argon2id-single-op.json
          if-no-files-found: error
          retention-days: 30
