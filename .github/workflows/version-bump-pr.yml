name: Version Bump PR

on:
  pull_request:
    types: [closed]
    branches: [main]

# Least privilege by default. Only the open-pr job is granted write scopes.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12.13"
  POETRY_VERSION: "2.4.1"

concurrency:
  group: version-bump-${{ github.event.pull_request.base.ref }}
  cancel-in-progress: false

jobs:
  # Job 1: runs repo code and third-party dependencies (poetry install, the
  # app composition import). It holds NO write scope and NO VERSION_BUMP_TOKEN:
  # only a read-only GITHUB_TOKEN (not persisted in .git/config) and the
  # FORGEJO_READ_TOKEN, which exists only in the install step's env. Its sole
  # output is a patch artifact plus a validated version string.
  bump:
    name: Compute version bump
    if: >-
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.head.ref, 'automation/version-bump-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      impact: ${{ steps.impact.outputs.impact }}
      bump: ${{ steps.impact.outputs.bump }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version bump
        id: impact
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        run: python3 -I scripts/ci/version_labels.py

      # Seed from the rolling bump branch (if it has a newer pending version)
      # so an unmerged bump isn't lost or downgraded when the branch is
      # recreated from the base ref. The repository is public, so this fetch is
      # anonymous: no token is present in this step.
      - name: Seed pending version
        if: steps.impact.outputs.bump != 'none'
        env:
          BUMP_BRANCH: automation/version-bump-${{ github.event.pull_request.base.ref }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          PENDING=""
          if git fetch "$REPO_URL" "$BUMP_BRANCH" 2>/dev/null; then
            PENDING="$(git show FETCH_HEAD:VERSION 2>/dev/null | tr -d '[:space:]')" || PENDING=""
          fi
          python3 - "$PENDING" <<'PY'
          import sys
          from pathlib import Path

          pending = sys.argv[1]
          version_file = Path("VERSION")
          current = version_file.read_text(encoding="utf-8").strip()

          def parts(version: str) -> tuple[int, ...]:
              return tuple(int(piece) for piece in version.split("."))

          try:
              if pending and parts(pending) > parts(current):
                  version_file.write_text(pending + "\n", encoding="utf-8")
          except ValueError:
              pass
          PY

      # The bump regenerates deploy/product-manifest.json with the repo's own
      # generator, which imports the app composition and the private-index
      # dotmac-kernel. The Forgejo read token is scoped to the install step only.
      - name: Install Python
        if: steps.impact.outputs.bump != 'none'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        if: steps.impact.outputs.bump != 'none'
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        if: steps.impact.outputs.bump != 'none'
        env:
          POETRY_HTTP_BASIC_FORGEJO_USERNAME: ci-reader
          POETRY_HTTP_BASIC_FORGEJO_PASSWORD: ${{ secrets.FORGEJO_READ_TOKEN }}
        run: poetry install --only main --no-interaction

      - name: Apply version bump
        if: steps.impact.outputs.bump != 'none'
        env:
          BUMP: ${{ steps.impact.outputs.bump }}
        run: poetry run python -m scripts.bump_version "$BUMP"

      - name: Read bumped version
        if: steps.impact.outputs.bump != 'none'
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Refusing malformed version"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Export bump patch
        if: steps.impact.outputs.bump != 'none'
        run: git diff --no-color --no-ext-diff > "$RUNNER_TEMP/bump.patch"

      - name: Upload bump patch
        if: steps.impact.outputs.bump != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: version-bump-patch
          path: ${{ runner.temp }}/bump.patch
          retention-days: 1

  # Job 2: holds the write scopes and VERSION_BUMP_TOKEN. It installs no
  # dependencies and executes no repository code: it only validates and applies
  # the patch produced by the bump job, then opens the PR.
  open-pr:
    name: Open version bump PR
    needs: bump
    if: needs.bump.outputs.bump != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Download bump patch
        uses: actions/download-artifact@v4
        with:
          name: version-bump-patch
          path: ${{ runner.temp }}/patch

      # The expected version is recomputed here, independently of the bump job:
      # label kind (same mapping the bump job uses, from scripts/ci/version_labels.py)
      # applied to max(base VERSION, pending VERSION on the rolling bump branch).
      # The pending fetch is anonymous (public repo) and digits-only validated.
      - name: Resolve pending version
        id: pending
        env:
          BUMP_BRANCH: automation/version-bump-${{ github.event.pull_request.base.ref }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          PENDING=""
          if git fetch "$REPO_URL" "$BUMP_BRANCH" 2>/dev/null; then
            PENDING="$(git show FETCH_HEAD:VERSION 2>/dev/null | tr -d '[:space:]')" || PENDING=""
          fi
          if ! printf '%s' "$PENDING" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            PENDING=""
          fi
          echo "version=$PENDING" >> "$GITHUB_OUTPUT"

      # scripts/ci/validate_bump_patch.py is base-branch code (stdlib only,
      # nothing installed). It treats the patch and the bump job's version as
      # untrusted: exact-path allowlist, no binary/new/renamed/mode-changed
      # files, every changed line a version or digest line, and the version must
      # equal the independently computed expected version.
      - name: Validate and apply bump patch
        env:
          PATCH_FILE: ${{ runner.temp }}/patch/bump.patch
          BUMP_VERSION: ${{ needs.bump.outputs.version }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
          PENDING_VERSION: ${{ steps.pending.outputs.version }}
        run: |
          set -euo pipefail
          printf '%s' "$BUMP_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::Refusing malformed version"; exit 1; }
          python3 -I scripts/ci/validate_bump_patch.py \
            --patch "$PATCH_FILE" --version "$BUMP_VERSION" --root . \
            --labels-env LABELS_JSON --pending-version "$PENDING_VERSION"
          git apply --check "$PATCH_FILE"
          git apply "$PATCH_FILE"
          test "$(cat VERSION)" = "$BUMP_VERSION"

      # GitHub does not trigger workflow runs for events raised with GITHUB_TOKEN --
      # a deliberate guard against workflows recursing into themselves. So when we
      # fall back to it, the bump PR opens with *zero* checks, the required contexts
      # on the base branch never report, and the PR is unmergeable except by an admin
      # bypass. That failure is silent, which is how main's VERSION drifted far behind
      # the bump PR's. Surface it here, and say so in the PR body, instead.
      # "Present" must mean "works", not "non-empty". A secret set to a
      # placeholder (or to an expired token) is worse than an unset one: the
      # naive -n check passes, the warning below never fires, and the PR-creation
      # step then fails authentication with no explanation. So actually exercise
      # the token, and fall back to GITHUB_TOKEN if it does not authenticate.
      - name: Check PR-creation token
        id: token
        env:
          VERSION_BUMP_TOKEN: ${{ secrets.VERSION_BUMP_TOKEN }}
        run: |
          note_broken() {
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=VERSION_BUMP_TOKEN $1::The bump PR falls back to GITHUB_TOKEN, so CI will not run on it (GitHub does not trigger workflows for GITHUB_TOKEN events) and its required checks can never report. It will sit unmergeable until VERSION_BUMP_TOKEN is a PAT or GitHub App token with contents:write + pull-requests:write."
          }

          if [ -z "$VERSION_BUMP_TOKEN" ]; then
            note_broken "is not set"
          elif ! curl -sfL -o /dev/null \
              -H "Authorization: Bearer $VERSION_BUMP_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/user; then
            note_broken "is set but does not authenticate"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create version bump PR
        uses: peter-evans/create-pull-request@v6
        with:
          # Select on the *validated* verdict, not on `|| secrets.GITHUB_TOKEN`.
          # A junk VERSION_BUMP_TOKEN is non-empty, so the `||` fallback would
          # happily pass it through and fail auth here instead of degrading.
          token: ${{ steps.token.outputs.present == 'true' && secrets.VERSION_BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          base: ${{ github.event.pull_request.base.ref }}
          branch: automation/version-bump-${{ github.event.pull_request.base.ref }}
          delete-branch: true
          commit-message: "chore: bump version to ${{ needs.bump.outputs.version }}"
          title: "chore: bump version to ${{ needs.bump.outputs.version }}"
          body: |
            Rolling version bump PR for `${{ github.event.pull_request.base.ref }}` — updated in place as source PRs merge, carrying any pending bump forward.

            Version impact: none because this PR only applies generated version bumps.
            ${{ steps.token.outputs.present == 'false' && '
            > [!WARNING]
            > **This PR cannot merge as-is, and no CI will run on it.**
            >
            > It was created with `GITHUB_TOKEN`, and GitHub does not trigger workflow
            > runs for events raised with that token (a recursion guard). So the required
            > status checks on the base branch will never report, and the PR stays
            > `BLOCKED` — merging it needs an admin bypass every time.
            >
            > Fix: set a repo secret `VERSION_BUMP_TOKEN` to a PAT or GitHub App token with
            > `contents: write` + `pull-requests: write`. This workflow already prefers it
            > over `GITHUB_TOKEN`; once set, the next bump PR runs CI and merges on green.
            ' || '' }}
            Latest source PR: #${{ github.event.pull_request.number }}
            Latest source impact: ${{ needs.bump.outputs.impact }}
            New version: ${{ needs.bump.outputs.version }}
          labels: "version:none"
