name: Isolated PR consolidation 20260915

on:
  push:
    branches: [work/consolidate-open-prs-20260915]
    paths: [.github/workflows/isolated-pr-consolidation.yml]

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: isolated-pr-consolidation-20260915
  cancel-in-progress: false

env:
  DATABASE_URL: sqlite:///./test.db
  SECRET_KEY: ci-test-secret-key-not-for-production
  REDIS_URL: redis://localhost:6379/0

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ee6945c15264a61e9c3498965a5dc746cab33547
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Restore the identical locked environment from this PR's CI
        uses: actions/download-artifact@v4
        with:
          name: python-environment
          path: ${{ runner.temp }}/python-environment
          github-token: ${{ github.token }}
          repository: michaelayoade/dotmac_sub
          run-id: 35000151794
      - name: Configure the shared environment
        run: |
          if [ -L .venv ]; then rm .venv; fi
          tar -xzf "$RUNNER_TEMP/python-environment/python-venv.tar.gz"
          tar -xzf "$RUNNER_TEMP/python-environment/poetry-home.tar.gz" -C "$HOME"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/poetry" config virtualenvs.create true
          "$HOME/.local/bin/poetry" config virtualenvs.in-project true
      - name: Repair the missing optional bounds and add legacy-query coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-repair-evidence"
          test "$(gh api repos/michaelayoade/dotmac_sub/pulls/3166 --jq .head.sha)" = ee6945c15264a61e9c3498965a5dc746cab33547
          git switch -c work/consolidation-3166-ci-fix-1
          python - <<'PY'
          from pathlib import Path
          path = Path("app/services/sales/service.py")
          text = path.read_text()
          old = "            lead_id=coerce_uuid(lead_id) if lead_id else None,\n            is_active=True if is_active is None else is_active,\n"
          new = "            lead_id=coerce_uuid(lead_id) if lead_id else None,\n            created_from=None,\n            created_to_exclusive=None,\n            is_active=True if is_active is None else is_active,\n"
          if text.count(old) != 1:
              raise RuntimeError("Legacy Quote list repair context changed")
          path.write_text(text.replace(old, new, 1))
          test = Path("tests/test_quote_legacy_list_compatibility.py")
          if test.exists():
              raise RuntimeError("Regression test already exists")
          test.write_text('''"""Legacy Quote callers retain all-time filtering after date-filter additions."""
          
          from datetime import UTC, datetime
          
          from sqlalchemy.orm import Session
          
          from app.models.sales import Quote
          from app.models.subscriber import Subscriber
          from app.services import sales
          
          
          def test_legacy_quote_list_keeps_all_time_scope(
              db_session: Session, subscriber: Subscriber
          ) -> None:
              old = Quote(
                  subscriber_id=subscriber.id,
                  created_at=datetime(2020, 1, 1, tzinfo=UTC),
              )
              future = Quote(
                  subscriber_id=subscriber.id,
                  created_at=datetime(2040, 1, 1, tzinfo=UTC),
              )
              inactive = Quote(
                  subscriber_id=subscriber.id,
                  created_at=datetime(2041, 1, 1, tzinfo=UTC),
                  is_active=False,
              )
              db_session.add_all([old, future, inactive])
              db_session.commit()
              rows = sales.quotes.list(
                  db_session,
                  lead_id=None,
                  status=None,
                  is_active=None,
                  order_by="created_at",
                  order_dir="desc",
                  limit=25,
                  offset=0,
              )
              typed = sales.quotes.query(db_session, sales.QuoteListQueryInput())
              assert [row.id for row in rows] == [future.id, old.id]
              assert [row.id for row in typed.items] == [row.id for row in rows]
              assert typed.total_count == len(rows) == 2
          ''')
          PY
          poetry run ruff format app/services/sales/service.py tests/test_quote_legacy_list_compatibility.py
          poetry run ruff check app tests scripts alembic
          poetry run ruff format --check app tests scripts alembic
          python -m compileall -q app tests scripts alembic
          git diff --check
      - name: Validate the full type-check command
        run: poetry run mypy app --ignore-missing-imports --no-incremental 2>&1 | tee "$RUNNER_TEMP/ci-repair-evidence/mypy.log"
      - name: Validate focused Quote and Lead regressions
        run: >-
          poetry run pytest tests/test_quote_legacy_list_compatibility.py
          tests/test_web_sales_quotes_list.py tests/test_lead_created_date_filters.py
          tests/architecture/test_sales_quote_list_query_boundary.py
          tests/architecture/test_lead_created_date_ownership.py
          -q --tb=short -o "addopts="
          2>&1 | tee "$RUNNER_TEMP/ci-repair-evidence/pytest.log"
      - name: Publish only the reviewed repair to a temporary source ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/michaelayoade/dotmac_sub/pulls/3166 --jq .head.sha)" = ee6945c15264a61e9c3498965a5dc746cab33547
          git diff --exit-code ee6945c15264a61e9c3498965a5dc746cab33547 -- VERSION .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/services/sales/service.py tests/test_quote_legacy_list_compatibility.py
          git commit -m 'fix(sales): retain legacy quote list all-time bounds'
          git push origin HEAD:refs/heads/work/consolidation-3166-ci-fix-1
          git rev-parse HEAD | tee "$RUNNER_TEMP/ci-repair-evidence/head.txt"
      - name: Preserve repair evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/ci-repair-evidence"
          git diff > "$RUNNER_TEMP/ci-repair-evidence/uncommitted.diff"
          git bundle create "$RUNNER_TEMP/ci-repair-evidence/source.bundle" --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: consolidation-ci-repair
          path: ${{ runner.temp }}/ci-repair-evidence
          retention-days: 7
