[project]
name = "dotmac-sub-billing-adoption"
version = "0.1.0a1"
description = "Isolated, typed dotmac-billing adoption rehearsal for dotmac_sub"
requires-python = ">=3.12,<3.13"
dependencies = [
    "dotmac-kernel==0.1.0a69",
    "dotmac-billing==0.1.0a1",
]

[tool.poetry]
packages = [{ include = "sub_billing_adoption", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
dotmac-kernel = { version = "0.1.0a69", source = "forgejo" }
dotmac-billing = { version = "0.1.0a1", source = "forgejo" }

[tool.poetry.group.dev.dependencies]
pytest = "8.2.2"
ruff = ">=0.15.0"
mypy = ">=1.11.0"

[[tool.poetry.source]]
name = "forgejo"
url = "https://registry.dotmac.io/api/packages/dotmac/pypi/simple/"
priority = "explicit"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not postgres'"
markers = [
    "postgres: requires the explicitly disposable Billing shadow database",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
