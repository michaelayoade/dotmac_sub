# STAGING-LOCAL, untracked.
#
# dotmac_omni_default owns 172.20.255.0/24 on this host. The sub bridge uses an
# adjacent subnet configured in .env so deploy automation and bare Compose
# commands resolve to the same IPAM configuration.
#
# Keep the bridge inside RADIUS_PROBE_CLIENT_SUBNET; moving it outside that
# range silently breaks synthetic RADIUS authentication probes.
networks:
  default:
    name: dotmac_sub_default
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:?DOCKER_SUBNET must be set in staging .env}

# Staging must remain reachable on its private host address while retaining the
# production-safe loopback default in the tracked base Compose file.
services:
  app:
    ports: !override
      - "10.120.121.20:8001:8001"

  # Staging must never originate periodic production-facing work. The scheduler
  # can only be created when an operator deliberately opts into this profile;
  # ordinary deploys and bare `docker compose up` commands exclude it.
  celery-beat:
    profiles:
      - production-scheduler

  # Staging-only object storage. It is intentionally internal-only because the
  # ERP stack already owns host ports 9000 and 9001 on this server.
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: dotmac_sub_minio
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY must be set}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY must be set}
    volumes:
      - minio_data:/data

volumes:
  minio_data:
    external: true
    name: dotmac_sub_minio_data
