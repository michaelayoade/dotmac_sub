[alembic]
script_location = alembic
prepend_sys_path = .

# Composed migration lineages, in the order Alembic should discover them. Sub's
# own lineage stays first: it supplies `tenant_scope_catalog.v1` and
# `module_database_roles.v1`, which every composed module requires, and
# app/migration_bindings.py names the exact revisions that do.
#
# A module lineage lives inside its installed distribution, never copied here —
# copying would fork the module's schema history into Sub. Alembic resolves the
# `package:resource` entries through the installed distributions before it runs
# env.py; declaring them here is therefore load-bearing. Adding them from env.py
# is too late because the ScriptDirectory and revision map already exist.
version_locations = %(here)s/alembic/versions dotmac_billing.migrations:versions dotmac_collections.migrations:versions dotmac_payments.migrations:versions dotmac_service_orders.migrations:versions dotmac_subscriptions.migrations:versions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
