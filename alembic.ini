[alembic]
script_location = alembic
prepend_sys_path = .

# Composed migration lineages, in the order Alembic should discover them. Sub's
# own lineage stays first: it supplies `tenant_scope_catalog.v1` and
# `module_database_roles.v1`, which every composed module requires, and
# app/migration_bindings.py names the exact revisions that do.
#
# A module lineage lives inside its installed distribution, never copied here —
# copying would fork the module's schema history into Sub. The installed
# directories are appended by alembic/env.py from each module's own
# `versions_dir()`, because their location depends on where the distribution was
# installed and must not be a hardcoded site-packages path.
version_locations = %(here)s/alembic/versions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
